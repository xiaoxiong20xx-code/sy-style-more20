<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>59 冰雕 · Ice Carving</title>
<script src="../../lib/core.js"></script><script src="../../lib/track.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 59 冰雕 · ICE CARVING =====
   Real world: a night event hall, a block of clear ice on a wet black stone floor, a carver's long flat chisel.
   The swan is roughed out; on every beat the chisel shaves a chunk off the rough shell — chips and snow spray — and the
   smooth, frosty swan comes out from wing to beak. On 4.0 the LED in the plinth comes on: light climbs through the
   ice, catches every bubble and crack, the frosted cuts glow, the edges split into rainbow. The camera circles low;
   on 8.0 a single drop of melt water lets go of the beak.
   SDF swan (ellipsoids, S-neck of round cones, fan wings with feather grooves, plinth); the rough shell is cut into
   Worley chunks that vanish on the strike nearest to them; ice traced like glass (IOR 1.31, multiple interfaces) with
   in-ice scattering from bubbles, frosted surfaces, per-channel IOR at the exit for dispersion, a wet mirror floor. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#020306');
Reel.ownJitter = true;
const C = Reel.cfg({});

const STR = [   // strikes: time, contact point, chisel direction (blade -> handle; from camera-right, along the surface)
  { t: 0.5, p: [-0.1, 0.98, 0.36], d: [0.92, 0.32, 0.2] },
  { t: 1.0, p: [-0.3, 0.86, 0.38], d: [0.9, 0.28, 0.25] },
  { t: 1.5, p: [0.5, 0.66, 0.2], d: [0.9, 0.2, 0.35] },
  { t: 2.0, p: [0.62, 0.98, 0.1], d: [0.95, 0.15, 0.25] },
  { t: 2.5, p: [0.24, 1.27, 0.1], d: [0.9, 0.3, 0.3] },
  { t: 3.0, p: [0.45, 1.6, 0.1], d: [0.8, 0.5, 0.3] },
  { t: 3.5, p: [0.63, 1.5, 0.05], d: [0.9, 0.3, 0.3] },
];
const NCH = 40;
// 光色旋钮：底座 LED 灯（4.0 秒亮起）的颜色。[1, 1, 1] = 原片。着色器里的 LIGHT_COL 和飘雪的 LED 部分都读这一处。
const LIGHT_COL = [1, 1, 1];

const SWAN_GLSL = `
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1. / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2; vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv);
  float y2 = y * y * l2, z2 = z * z * l2; float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
vec3 cub(vec3 a, vec3 b, vec3 c, vec3 d, float t){ float s = 1. - t; return s * s * s * a + 3. * s * s * t * b + 3. * s * t * t * c + t * t * t * d; }
float wing(vec3 p, float s){
  vec3 O = vec3(.04, .82, s * .21);
  vec3 U = normalize(vec3(-1., .85, s * .2));
  vec3 V = normalize(cross(vec3(0., 0., s), U)); V *= sign(V.y + 1e-4) * -1.;   // points up-back
  vec3 W = cross(U, V);
  vec3 q = p - O; vec3 l = vec3(dot(q, U), dot(q, V), dot(q, W) * s);
  float r = length(l.xy), a = atan(l.y, l.x);
  float R = .68 * (1. - .28 * smoothstep(-.6, .7, a)) + .04 * abs(cos(a * 11.)) * smoothstep(.3, .5, r / .68);
  float d2 = max(r - R, max(-.65 - a, a - .75) * r);
  // thick at the shoulder, thinning out; three terraces of feathers with scalloped edges
  float rn = r / .68;
  float th = .085 * pow(max(1. - rn, 0.), .55) + .02;
  for (int k = 0; k < 3; k++){
    float Rk = (.3 + .2 * float(k)) * .68 + .022 * abs(cos(a * (7. + 3. * float(k))));
    th -= .012 * smoothstep(Rk - .006, Rk + .006, r);
  }
  float z = l.z - .1 * r * r + .03 * sin(a * 2.);
  // the outer face is rounded like a feathered back, the inner face flatter
  float tz = z > 0. ? th * (1. - .35 * pow(abs(fract(a * 5.5 + .25) - .5) * 2., 2.) * step(.55, rn)) : th * .7;
  vec2 w = vec2(d2, abs(z) - tz);
  float d = min(max(w.x, w.y), 0.) + length(max(w, 0.));
  // V-cut grooves between the primaries, deeper toward the tips
  float g = abs(fract(a * 5.5 + .25) - .5);
  d += .012 * smoothstep(.08, .0, g) * smoothstep(.45, .7, rn) * step(0., z);
  return d * .8;
}
float sdSwan(vec3 p){
  float d = sdEllipsoid(p - vec3(-.02, .64, 0.), vec3(.56, .3, .34));
  d = smin(d, sdEllipsoid(p - vec3(.3, .72, 0.), vec3(.26, .25, .26)), .14);
  d = smin(d, sdEllipsoid(rotZ(.55) * (p - vec3(-.52, .8, 0.)), vec3(.2, .06, .13)), .12);
  // the neck
  vec3 P0 = vec3(.32, .74, 0.), P1 = vec3(.66, .96, 0.), P2 = vec3(.1, 1.3, 0.), P3 = vec3(.36, 1.5, 0.);
  vec3 pr = P0; float rp = .155;
  if (length(p - vec3(.35, 1.1, 0.)) < .65) {
    for (int i = 1; i <= 12; i++){ float t = float(i) / 12.; vec3 c = cub(P0, P1, P2, P3, t); float r = mix(.155, .075, pow(t, .75)); d = smin(d, sdRoundCone(p, pr, c, rp, r), .05); pr = c; rp = r; }
    d = smin(d, sdEllipsoid(rotZ(-.2) * (p - vec3(.43, 1.56, 0.)), vec3(.13, .095, .09)), .05);
    d = smin(d, sdRoundCone(p, vec3(.5, 1.53, 0.), vec3(.69, 1.47, 0.), .042, .009), .02);
  }
  d = smin(d, wing(p, 1.), .05);
  d = smin(d, wing(p, -1.), .05);
  // the plinth
  d = smin(d, sdRoundBox(p - vec3(0., .2, 0.), vec3(.66, .2, .44), .025), .06);
  return d;
}
`;
const rm = Reel.RM(stage, {
  bloom: 0.6, th: 1.0, expo: 1.0, vig: 0.45, grain: 0.03, ca: 0.5, contrast: 1.05, sat: 1.0, bands: 6,
  lift: [0.003, 0.004, 0.007],
  uniforms: `
uniform vec3 uRo, uTa; uniform float uF, uT;
uniform vec4 uStr[7];          // strike point, time
uniform sampler2D uCell;       // each chunk's distance to the swan (baked once)
uniform float uMargin, uCarveK; // how far from the swan chunks may still stand; 1 while carving, 0 after
uniform vec4 uCh[${NCH}];        // chip position, size (0 = none)
uniform vec3 uChiT, uChiD; uniform float uChiOn;   // chisel blade tip, direction
uniform vec4 uGlow;            // inner light level, front height, frost, work light
uniform vec4 uDrop;            // drop centre, radius
uniform float uDropS;          // drop stretch
uniform vec4 uFl; uniform vec3 uFlR;   // the snowflake that lands on the beak: centre + size, rotation
uniform vec4 uMo[160]; uniform vec4 uMoC[160]; uniform int uNM; uniform float uFocus;   // falling snow: screen xy, radius, intensity / colour, distance`,
  scene: `
${SWAN_GLSL}
float chunkTime(vec3 s){
  float bt = 9., bd = 1e3;
  for (int k = 0; k < 7; k++){ float d = length(s - uStr[k].xyz); if (d < bd) { bd = d; bt = uStr[k].w; } }
  return bt;
}
float cellDist(vec3 g){
  ivec3 i = ivec3(g) + ivec3(7, 2, 5);
  if (i.x < 0 || i.y < 0 || i.z < 0 || i.x > 13 || i.y > 15 || i.z > 9) return 9.;
  return texelFetch(uCell, ivec2(i.x + i.z * 14, i.y), 0).r;
}
bool presentCell(vec3 g, vec3 s){
  float ds = cellDist(g);
  if (ds > uMargin) return false;

  return true;
}
float sdIce(vec3 p){
  float d = sdSwan(p);
  if (uT < 3.67) {
    float rough = sdRoundBox(p - vec3(0., .84, 0.), vec3(.74, .84, .5), .006);
    if (rough < d) {
      vec3 c = floor(p / .13); float d1 = 1e3, dP = 1e3, dR = 1e3; float pres1 = 1.;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) for (int k = -1; k <= 1; k++){
        vec3 g = c + vec3(i, j, k); vec3 s = (g + .15 + .7 * hash33(g)) * .13;
        float dd = length(p - s);
        bool pr = presentCell(g, s);
        if (pr) dP = min(dP, dd); else dR = min(dR, dd);
        if (dd < d1) { d1 = dd; pres1 = pr ? 1. : 0.; }
      }
      float cell = pres1 > .5 ? -(min(dR, .5) - d1) * .5 : (min(dP, .5) - d1) * .5;
      d = min(d, max(rough, cell));
    }
  }
  // the drop of melt water
  if (uDrop.w > .001) {
    vec3 q = p - uDrop.xyz; q.y /= uDropS;
    d = min(d, (length(q) - uDrop.w) * min(uDropS, 1.));
  }
  return d;
}
// chips and the chisel are opaque-ish small things
float sdChips(vec3 p){
  float d = 1e3;
  for (int i = 0; i < ${NCH}; i++){
    vec4 c = uCh[i]; if (c.w <= 0.) continue;
    vec3 q = p - c.xyz; if (dot(q, q) > .04) { d = min(d, length(q) - c.w * 1.5); continue; }
    vec3 h = hash33(vec3(float(i), c.w * 97., 1.));
    q = rotX(h.x * 6.28 + uT * 7.) * rotY(h.y * 6.28 + uT * 5.) * q;
    d = min(d, sdRoundBox(q, vec3(c.w, c.w * .55, c.w * .3), c.w * .15));
  }
  return d;
}
float sdFlake(vec3 p){
  if (uFl.w <= 0.) return 1e3;
  vec3 q = p - uFl.xyz;
  if (dot(q, q) > uFl.w * uFl.w * 9.) return length(q) - uFl.w * 2.5;
  q = rotZ(uFlR.x) * rotX(uFlR.y) * rotY(uFlR.z) * q / uFl.w;      // flake lies in its local xz plane, radius 1
  float a = atan(q.z, q.x), r = length(q.xz);
  a = mod(a + .5236, 1.0472) - .5236;
  vec2 s = vec2(cos(a), abs(sin(a))) * r;
  float d = length(s - vec2(clamp(s.x, 0., 1.), 0.)) - .055 * (1. - .5 * clamp(s.x, 0., 1.));
  for (int k = 0; k < 3; k++){
    float b0 = .32 + .2 * float(k), bl = .34 - .09 * float(k);
    vec2 a0 = vec2(b0, 0.), dir = vec2(.5, .866);
    float h = clamp(dot(s - a0, dir), 0., bl);
    d = min(d, length(s - a0 - dir * h) - .035);
  }
  d = min(d, r - .16);                                              // the hexagonal plate in the middle
  return max(d, abs(q.y) - .025) * uFl.w;
}
float sdChisel(vec3 p){
  if (uChiOn < .5) return 1e3;
  vec3 D = normalize(uChiD);
  vec3 S = normalize(cross(D, vec3(0., 1., 0.)));
  vec3 Uu = cross(S, D);
  vec3 q = p - uChiT; vec3 l = vec3(dot(q, S), dot(q, Uu), dot(q, D));
  // blade: wide, thin, bevelled at the edge
  float bz = clamp(l.z / .34, 0., 1.);
  float blade = sdRoundBox(l - vec3(0., 0., .17), vec3(.004 + .01 * smoothstep(0., .25, bz), .05 - .012 * bz, .17), .002);
  float sock = sdCapsule(l, vec3(0., 0., .33), vec3(0., 0., .47), .021 + .004 * clamp((l.z - .33) / .14, 0., 1.));
  float handle = sdCapsule(l, vec3(0., 0., .47), vec3(0., 0., 1.55), .03);
  return min(min(blade, sock), handle);
}
const vec3 LK = normalize(vec3(-.35, .88, .3));   // the open dusk sky above
const vec3 LIGHT_COL = vec3(${LIGHT_COL.join(', ')});   // plinth LED colour, set in JS
// --- winter dusk: blue-hour sky, a warm afterglow low on one side, two rows of snowy pines, lanterns in the snow ---
float pines(float az, float el, float seed, float sc, out float snowM){
  float x = az * sc; float c = floor(x);
  float f = fract(x) - .5 + .25 * (hash11(c * 2.3 + seed) - .5);
  float h = (.045 + .1 * hash11(c + seed)) * step(.2, hash11(c * 1.7 + seed));
  float w = .5 * (.3 + .22 * hash11(c * 3.1 + seed));
  float y = el / max(h, 1e-4);
  float jag = vnoise2(vec2(y * 13., c * 3.1 + seed)) * .55 + vnoise2(vec2(y * 41., c * 7.3)) * .3;
  float hw = w * pow(max(1. - y, 0.), .85) * (.62 + .6 * jag);
  float m = step(0., y) * step(y, 1.03) * smoothstep(hw + .02, hw - .02, abs(f));
  snowM = m * smoothstep(.5, .78, vnoise2(vec2(f * 18. + c, y * 26.)) + .25 * (1. - abs(f) / max(hw, 1e-3)) - .15);
  return m;
}
vec3 bg(vec3 rd){
  float el = asin(clamp(rd.y, -1., 1.)), az = atan(rd.x, -rd.z);
  // blue-hour sky, a warm afterglow low in the west
  vec3 c = mix(vec3(.075, .095, .2), vec3(.008, .016, .055), smoothstep(-.02, .55, el));
  c += vec3(.5, .22, .12) * exp(-max(el, 0.) * 11.) * exp(-pow(az + .9, 2.) * 1.1) * .55;
  c *= .6 + .4 * uGlow.w;
  // far row of pines (hazy), near row (darker), snow lying in patches on the branches
  float sn; float m1 = pines(az, el + .004, 3., 9., sn);
  c = mix(c, mix(vec3(.032, .045, .085), vec3(.11, .13, .2), sn), m1 * .9);
  float sn2; float m2 = pines(az + .3, el + .014, 7., 5.5, sn2);
  c = mix(c, mix(vec3(.012, .018, .032), vec3(.16, .19, .28), sn2) * (.6 + .4 * uGlow.w), m2);
  // the snowfield to the horizon
  if (el < -.004) c = mix(vec3(.07, .085, .16), vec3(.12, .14, .24), smoothstep(-.004, -.2, el)) * (.65 + .35 * uGlow.w);
  // lanterns and ice lanterns standing in the snow at two distances: warm and cold points with halos
  for (int L = 0; L < 2; L++) {
    float sc = L == 0 ? 15. : 6.;
    vec2 q = vec2(az * sc + float(L) * 2.3, (el + (L == 0 ? .006 : .03)) * sc * 4.);
    vec2 cc = vec2(floor(q.x), float(L)); float h = hash12(cc + 1.);
    if (h > (L == 0 ? .4 : .62)) {
      vec2 o = vec2(fract(q.x) - .25 - .5 * hash12(cc + 3.), q.y);
      float ice = step(.8, hash12(cc + 9.));
      vec3 lc = mix(vec3(1., .58, .25), vec3(.55, .78, 1.), ice);
      float core = smoothstep(L == 0 ? .14 : .2, .02, length(o * vec2(1., 1.3)));
      c += lc * (core * (L == 0 ? 1.4 : 2.2) + smoothstep(.45, .0, length(o)) * (L == 0 ? .1 : .16)) * (.6 + .4 * hash12(cc + 11.));
    }
  }
  return c;
}
float groundH(vec2 xz){
  float h = .05 * fbm2(xz * .55) + .015 * fbm2(xz * 3.);
  // the carver's boot prints coming in from front-right
  for (int i = 0; i < 12; i++){
    float fi = float(i);
    vec2 c = vec2(1.15 + fi * .22, .95 + fi * .3) + vec2((mod(fi, 2.) - .5) * .14, 0.);
    vec2 d = xz - c; d = mat2(.8, -.6, .6, .8) * d;
    h -= .035 * smoothstep(1., .55, length(d / vec2(.065, .14)));
  }
  return h;
}
float snowSD(vec3 q){
  float g = q.y + .32 - groundH(q.xz);
  float pl = sdRoundBox(q - vec3(0., -.17, 0.), vec3(.98, .16, .72), .1) - .012 * fbm(q * 6.);   // the packed-snow stand
  return smin(g, pl, .12);
}
vec3 render(vec2 fc){
  vec2 uv = (fc - .5 * uRes) / uRes.y * 2.;
  mat3 cm = camMat(uRo, uTa, 0.);
  vec3 rd = normalize(cm * vec3(uv, uF)), p = uRo;
  vec3 acc = vec3(0.), thr = vec3(1.);
  bool inI = false; float firstD = -1.;
  const vec3 ABS = vec3(.13, .03, .012);
  float jit = hash12(fc + fract(uT * 7.31) * 113.);
  for (int b = 0; b < 8; b++){
    float tt = 0.; bool hit = false; int what = 0;
    for (int i = 0; i < 220; i++){
      vec3 q = p + rd * tt;
      float di = sdIce(q);
      if (inI) {
        float dd = -di;
        if (dd < .0006) { hit = true; what = 1; break; }
        float st = clamp(dd * .7, .004, .03) * (.8 + .4 * jit);
        // light inside the ice: climbs from the plinth, scattered by bubbles and the cloudy heart
        float bub = smoothstep(.62, .9, vnoise(q * 38.)) * .35 + smoothstep(.55, .8, fbm(q * 9.)) * smoothstep(.25, .0, abs(q.z)) * .5;
        // tiny seed bubbles: bright specks
        vec3 bc = floor(q * 30.); vec3 bo = (bc + .2 + .6 * hash33(bc)) / 30.;
        float sb = step(.955, hash13(bc + 7.)) * smoothstep(.0045, .001, length(q - bo));
        acc += thr * vec3(.8, .9, 1.) * sb * (.3 + 1.6 * uGlow.x * LIGHT_COL) * .5 * (1. - .95 * uCarveK);
        // a crack plane through the body: a sheet that catches the light
        float cp = dot(q - vec3(-.05, .7, .02), normalize(vec3(.5, .35, .8)));
        float cm = smoothstep(.16, .1, length((q - vec3(-.05, .7, .02)) * vec3(1., 1.6, 1.)) + .08 * fbm(q * 8.));
        cm *= .35 + .65 * smoothstep(.45, .75, fbm(q * 22.));      // a cracked sheet is patchy, not a disc
        if (abs(cp) < st * .6 && cm > .01) { acc += thr * vec3(.75, .88, 1.) * (.35 * uGlow.w + .45 * uGlow.x * LIGHT_COL) * cm * .3; thr *= 1. - .15 * cm; }
        float lf = uGlow.x * smoothstep(uGlow.y + .1, uGlow.y - .15, q.y) * (.7 + 1.6 * exp(-q.y / .55));
        acc += thr * LIGHT_COL * vec3(.62, .82, 1.) * lf * (.1 + bub * 1.8) * st;
        acc += thr * vec3(.5, .6, .7) * bub * .02 * uGlow.w * st;
        if (uCarveK > .001) {
          float trail = smoothstep(.74, .9, vnoise(q * vec3(30., 7., 30.))) * (.4 + .6 * vnoise(q * 60.));
          float cloud = smoothstep(.42, .75, fbm(q * 4. + 3.)) * smoothstep(.5, .12, length((q.xz - vec2(0., .02)) * vec2(1., 1.4)));
          acc += thr * vec3(.64, .72, .86) * (trail * 1.3 + cloud * 1.1) * st * (.35 + .65 * uGlow.w) * uCarveK;
          acc += thr * vec3(.5, .58, .72) * st * .55 * uGlow.w * uCarveK;
          thr *= exp(-(vec3(cloud * 2.2 + trail * 1.2 + .35) + ABS * 1.8) * st * uCarveK);
        }
        thr *= exp(-ABS * st);
        tt += st;
      } else {
        float d = min(di, min(min(sdChips(q), sdChisel(q)), sdFlake(q)));
        float fl = tt < 24. ? snowSD(q) : 1e3; if (fl < d) d = fl;
        if (d < .0006) { hit = true; what = (fl <= d + .0001 && fl < di) ? 3 : di <= d + .0001 ? 1 : 2; break; }
        tt += d * .85; if (tt > 25.) break;
      }
    }
    if (firstD < 0.) firstD = hit ? tt : 25.;
    if (!hit) { acc += thr * bg(rd); break; }
    p += rd * tt;
    if (what == 3) {        // snow: soft, bright, glittering; lit by the dusk sky, the far lanterns and, later, the plinth
      vec2 e = vec2(.004, 0.);
      vec3 n = normalize(vec3(snowSD(p + e.xyy) - snowSD(p - e.xyy), snowSD(p + e.yxy) - snowSD(p - e.yxy), snowSD(p + e.yyx) - snowSD(p - e.yyx)));
      float ao = clamp(.55 + .45 * smoothstep(-.06, .02, groundH(p.xz) - .02), 0., 1.);
      float r = length(p.xz);
      vec3 L = vec3(.15, .2, .38) * (.45 + .55 * max(n.y, 0.)) * (.55 + .45 * uGlow.w)
             + vec3(1., .58, .28) * .09 * max(dot(n, normalize(vec3(-.6, .2, -.8))), 0.)
             + LIGHT_COL * vec3(.55, .78, 1.) * uGlow.x * 1.4 * exp(-max(r - .55, 0.) * 2.2) * max(n.y, .2);
      vec3 c = vec3(.9, .93, 1.) * L * ao;
      // glitter: crystals catching the light
      vec3 gc = floor(p * 260.);
      float gl = step(.985, hash13(gc)) * pow(max(dot(reflect(rd, n), normalize(vec3(-.3, .5, -.8) + hash33(gc) * .6 - .3)), 0.), 30.);
      c += vec3(.9, .95, 1.) * gl * (1.5 + 3. * uGlow.x * LIGHT_COL);
      // the chips that fell round the stand
      c += vec3(.7, .85, 1.) * step(.992, hash13(floor(p * 90.))) * smoothstep(1.4, .9, r) * (.4 + 1.5 * uGlow.x * LIGHT_COL);
      acc += thr * mix(c, bg(rd), smoothstep(6., 18., length(p - uRo)));
      break;
    }
    if (what == 2) {        // chips / chisel
      vec2 e = vec2(.0007, 0.);
      #define SO(x) min(min(sdChips(x), sdChisel(x)), sdFlake(x))
      vec3 n = normalize(vec3(SO(p + e.xyy) - SO(p - e.xyy), SO(p + e.yxy) - SO(p - e.yxy), SO(p + e.yyx) - SO(p - e.yyx)));
      if (sdFlake(p) < min(sdChips(p), sdChisel(p))) {      // the snowflake: white crystal, sparkling
        float tw = pow(max(dot(reflect(rd, n), normalize(vec3(-.2, .8, .5))), 0.), 40.);

/* ---------------- timeline ---------------- */
const nrm = (a) => { const l = Math.hypot(...a); return a.map((v) => v / l); };
const CHIPS = [];
(function () {

// the chisel: approaches, shaves through the contact on the beat, draws back

const CAM = Track([

const glc = rm.canvas.getContext('webgl2');

function bakeCells() {

precision highp float; in vec2 uv; out vec4 o;

// the block shrinks one layer per strike: outermost chunks first
const MRG = [0.95, 0.42, 0.28, 0.19, 0.13, 0.08, 0.04, -0.15];

  cues: [

    { t: 4.0, sfx: 'ice_glow', gain: 0.9 }, { t: 4.5, sfx: 'ice_shimmer', gain: 0.6 },
