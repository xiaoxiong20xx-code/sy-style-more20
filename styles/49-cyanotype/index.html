<script>
/* ===== 49 蓝晒 · CYANOTYPE SUN PRINT =====
   Shot 1 (0–4.0): a sheet of cold-press paper brushed with yellow-green sensitiser on a garden table in sun. A fern
   frond lands on 0.5, a head of Queen Anne's lace on 1.0, two ginkgo leaves on 1.5; a sheet of glass slides over on 2.0.
   Time-lapse: the sun swings across, cloud shadows race over, the sun's glint crosses the glass, and the coating
   bronzes everywhere the plants do not cover (leaf tissue lets a little light through, veins do not).
   Shot 2 (cut on frame 120 = 4.0): the print goes into a white enamel tray — water floods in from the paper's edges,
   Prussian blue blooms behind the wet front, the unexposed yellow dissolves into drifting clouds and the plants come
   up white, vein by vein. The tray is rocked; caustics swim over the print and the blue deepens.
   8.0: the print is lifted out of the water towards the lens, water sheets off, drops fall from its edge · hold. */
const stage = Reel.makeStage('#1b1712');
Reel.ownJitter = true;
const { clamp, lerp, E } = Reel;
const gl = CD.init(stage);
const W = CD.W, H = CD.H;
const POST = CD.post(gl);
const QUAD = SG.quad(gl);
const HD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';

const TW = 2048, TH = Math.round(2048 * PH / PW);
const F_CUT = 120;                      // 4.0 s: into the tray
const R = Reel.rng(4949), rr = (a, b) => a + (b - a) * R();

// ---------------- the plants, drawn once into paper-space textures ----------------
// each plant: R = coverage, G = light it lets through (0..1), B = thickness/height, A = colour class (0.25 fern, 0.5 lace, 0.75 ginkgo)
const toPx = (x, y) => [(x / PW + 0.5) * TW, (0.5 - y / PH) * TH];
function plantCanvas(draw) {

  const tr = document.createElement('canvas'); tr.width = TW; tr.height = TH;
  const a = cov.getContext('2d', { willReadFrequently: true }), b = tr.getContext('2d', { willReadFrequently: true });
  b.fillStyle = '#fff'; b.fillRect(0, 0, TW, TH);
  draw(a, b);
  return { a, b };
}
function packTex(pc, cls) {

  // height: blurred coverage
  const hc = document.createElement('canvas'); hc.width = TW; hc.height = TH; const hx = hc.getContext('2d', { willReadFrequently: true });
  hx.filter = 'blur(6px)'; hx.drawImage(pc.a.canvas, 0, 0); const Hh = hx.getImageData(0, 0, TW, TH).data;
  const out = new Uint8Array(TW * TH * 4);
  for (let i = 0; i < TW * TH; i++) {
    const c = A[i * 4 + 3];
    out[i * 4] = c; out[i * 4 + 1] = B[i * 4]; out[i * 4 + 2] = Hh[i * 4 + 3]; out[i * 4 + 3] = c > 0 ? cls : 0;
  }

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, TW, TH, 0, gl.RGBA, gl.UNSIGNED_BYTE, out);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

}
const S = TW / PW;    // px per cm
function quadPt(p0, p1, p2, s) { const u = 1 - s; return [u * u * p0[0] + 2 * u * s * p1[0] + s * s * p2[0], u * u * p0[1] + 2 * u * s * p1[1] + s * s * p2[1]]; }
// value noise for the tissue maps (deterministic)
const NG = 97, NGRID = Array.from({ length: NG * NG }, () => R());
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const g = (i, j) => NGRID[(((j % NG) + NG) % NG) * NG + (((i % NG) + NG) % NG)];
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return (g(xi, yi) * (1 - sx) + g(xi + 1, yi) * sx) * (1 - sy) + (g(xi, yi + 1) * (1 - sx) + g(xi + 1, yi + 1) * sx) * sy;

// tissue: lets 40–60 % of the light through, mottled; veins (drawn after) let almost none through
function tissue(a, b, base, amp) {
  const id = b.getImageData(0, 0, TW, TH); const d = id.data, ad = a.getImageData(0, 0, TW, TH).data;
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {

    if (c === 0) { d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255; d[i * 4 + 3] = 255; continue; }
    const n = vnoise(x / 38, y / 38) * 0.6 + vnoise(x / 11, y / 11) * 0.4;
    const v = base + amp * (n - 0.5) * 2;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255 * (1 - c) + v * c; d[i * 4 + 3] = 255;

function fern(a, b) {

  const tan = (s) => { const q = quadPt(p0, p1, p2, Math.min(1, s + 0.01)), w = quadPt(p0, p1, p2, Math.max(0, s - 0.01)); const l = Math.hypot(q[0] - w[0], q[1] - w[1]); return [(q[0] - w[0]) / l, (q[1] - w[1]) / l]; };

  const NPI = 30;

    for (const side of [-1, 1]) {
      const s = 0.06 + 0.92 * (i + (side > 0 ? 0.5 : 0)) / NPI + rr(-0.006, 0.006);
      if (s > 0.985) continue;

      const lobeAmp = Array.from({ length: nPin + 1 }, () => rr(0.62, 1.0) * (R() < 0.05 ? 0.45 : 1));
      const left = [], right = [];
      const nL = nPin * 8;
      for (let j = 0; j <= nL; j++) {

        const f = u * nPin - k0;

        const sh = Math.pow(Math.abs(Math.sin(u * nPin * Math.PI)), 0.55);
        const base = (0.5 * (1 - u * 0.8) + 0.06) * (0.6 + 0.4 * Math.min(1, s * 3 + 0.3)) * Math.min(1, u * 8 + 0.35);
        const wl = base * (0.66 + 0.34 * sh * lobeAmp[k0]) * (1 + 0.05 * Math.sin(u * 61)), wr = base * (0.66 + 0.34 * sh * lobeAmp[Math.min(nPin, k0 + 1)]) * (1 + 0.05 * Math.sin(u * 47 + 1));
        left.push(toPx(x - d2[1] * wl, y + d2[0] * wl)); right.push(toPx(x + d2[1] * wr, y - d2[0] * wr));
        if (j % 8 === 4) for (const sg of [-1, 1]) { const w2 = (sg < 0 ? wl : wr) * 0.8; lats.push([[x, y], [x + d2[0] * 0.18 - sg * d2[1] * w2, y + d2[1] * 0.18 + sg * d2[0] * w2]]); }
      }
      a.beginPath(); left.forEach(([X, Y], j) => (j ? a.lineTo(X, Y) : a.moveTo(X, Y))); right.reverse().forEach(([X, Y]) => a.lineTo(X, Y)); a.closePath(); a.fill();

  }

  const ra = []; for (let k = 0; k <= 60; k++) ra.push(toPx(...quadPt(p0, p1, p2, k / 60)));
  a.lineWidth = 0.3 * S; a.beginPath(); ra.forEach(([x, y], k) => (k ? a.lineTo(x, y) : a.moveTo(x, y))); a.stroke();
  a.lineWidth = 0.36 * S; a.beginPath(); a.moveTo(...toPx(-12.5, -8.6)); a.quadraticCurveTo(...toPx(-14.3, -10.4), ...toPx(-15.8, -11.4)); a.stroke();
  tissue(a, b, 150, 34);

  b.lineCap = 'round';
  b.strokeStyle = 'rgb(46,46,46)'; b.lineWidth = 0.035 * S;
  lats.forEach(([p, q]) => { b.beginPath(); b.moveTo(...toPx(...p)); b.lineTo(...toPx(...q)); b.stroke(); });
  b.strokeStyle = 'rgb(14,14,14)';
  mids.forEach((pl) => { b.lineWidth = 0.075 * S; b.beginPath(); pl.forEach((q, k) => { const [x, y] = toPx(q[0], q[1]); k ? b.lineTo(x, y) : b.moveTo(x, y); }); b.stroke(); });
  b.filter = 'blur(10px)'; b.strokeStyle = 'rgba(0,0,0,0.35)'; b.lineWidth = 0.9 * S;     // thicker tissue along the rachis
  b.beginPath(); ra.forEach(([x, y], k) => (k ? b.lineTo(x, y) : b.moveTo(x, y))); b.stroke(); b.filter = 'none';
  b.strokeStyle = 'rgb(6,6,6)'; b.lineWidth = 0.28 * S; b.beginPath(); ra.forEach(([x, y], k) => (k ? b.lineTo(x, y) : b.moveTo(x, y))); b.stroke();

}
function lace(a, b) {
  const C = [8.4, 3.2];
  a.fillStyle = '#000'; a.strokeStyle = '#000'; a.lineCap = 'round';
  b.lineCap = 'round';
  // main stem down to the paper edge
  a.lineWidth = 0.22 * S; a.beginPath(); a.moveTo(...toPx(...C)); a.quadraticCurveTo(...toPx(9.6, -4), ...toPx(11.8, -11.5)); a.stroke();
  b.strokeStyle = 'rgb(20,20,20)'; b.lineWidth = 0.22 * S; b.beginPath(); b.moveTo(...toPx(...C)); b.quadraticCurveTo(...toPx(9.6, -4), ...toPx(11.8, -11.5)); b.stroke();
  const NR = 22;
  for (let i = 0; i < NR; i++) {
    const ang = i / NR * Math.PI * 2 + rr(-0.12, 0.12), L = rr(3.6, 5.6);
    const E2 = [C[0] + Math.cos(ang) * L, C[1] + Math.sin(ang) * L * 0.92];
    a.lineWidth = 0.06 * S; a.beginPath(); a.moveTo(...toPx(...C)); a.lineTo(...toPx(...E2)); a.stroke();
    b.strokeStyle = 'rgb(60,60,60)'; b.lineWidth = 0.06 * S; b.beginPath(); b.moveTo(...toPx(...C)); b.lineTo(...toPx(...E2)); b.stroke();
    const nf = 12 + Math.floor(R() * 8);
    for (let j = 0; j < nf; j++) {
      const a2 = rr(0, Math.PI * 2), l2 = rr(0.35, 1.25);
      const F = [E2[0] + Math.cos(a2) * l2, E2[1] + Math.sin(a2) * l2];

        const pa = k / 5 * 6.283 + rr(0, 1), X = F[0] + Math.cos(pa) * fr * 0.7, Y = F[1] + Math.sin(pa) * fr * 0.7;
        a.beginPath(); a.arc(...toPx(X, Y), fr * 0.62 * S, 0, 7); a.fill();

    // irregular fan: wavy rim, a deep central notch, one small tear
    const pts = [[0, 0]];
    const c1 = [[-1.2, -0.9], [-3.6, -2.3], [-3.7, -3.9]];
    for (let k = 1; k <= 12; k++) { const u = k / 12, v = 1 - u; pts.push([3 * v * v * u * c1[0][0] + 3 * v * u * u * c1[1][0] + u * u * u * c1[2][0], 3 * v * v * u * c1[0][1] + 3 * v * u * u * c1[1][1] + u * u * u * c1[2][1]]); }
    for (let k = 0; k <= 60; k++) {

let T_FERN, T_LACE, T_GINK;

// ---------------- shader ----------------
const FS = HD + `
out vec4 o;
${CD.GLSL}
uniform float uT, uShot;
uniform sampler2D uP0, uP1, uP2;
uniform vec4 uPl[3];          // per plant while landing: (offset x, offset y, scale, lift cm)
uniform vec3 uSun;            // sun direction (shot 1)
uniform float uGlass;         // glass slide: x offset (cm) of its left edge; 99 = not there
uniform float uExpo;          // exposure progress 0..1
uniform float uLift, uRise;   // shot 2: lift angle (rad), rise (cm)
uniform float uRock;          // tray rocking amount
uniform vec4 uDrop[6];        // falling drops (x, y, z, r)
uniform vec4 uRip[6];         // ripples (x, y, t0, amp)

// --- the print's chemistry ---
float coat(vec2 p){      // brushed sensitiser with dry-brush edges
  float ex = 13.6 + .55*(vn(vec2(p.y*1.7, 3.)) - .5) + .35*vn(vec2(p.y*9., 1.));
  float ey = 9.0 + .4*(vn(vec2(p.x*.9, 7.)) - .5);
  float bristle = vn(vec2(p.x*.35, p.y*16.));
  float ix = smoothstep(ex + .2, ex - .5 - .7*bristle*smoothstep(ex - 2.5, ex, abs(p.x)), abs(p.x));

vec4 plantS(sampler2D T, vec2 p, vec4 X, float lod){
  vec2 q = (p - X.xy)/X.z;

  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return vec4(0.);

float transmit(vec2 p, float lod){     // light reaching the paper through the plants (final placement)
  float tr = 1.;

float exposureAt(vec2 p){ return transmit(p, 1.6); }
vec3 paperAlb(vec2 p){
  float f = vn(p*vec2(2.3, 2.1))*.5 + vn(p*7.3)*.3 + vn(p*23.)*.2;
  return vec3(.80, .785, .74)*(.93 + .1*f);

float paperTooth(vec2 p){ return vn(p*4.1)*.5 + vn(p*9.7 + 3.)*.3 + vn(p*21.)*.2; }
// ---- shot 1: printing in the sun ----
vec3 table(vec2 p){

float cloudSh(vec2 p){ return smoothstep(.45, .75, fbm(p*.012 + vec2(-uT*.55, uT*.12))); }

const prog = SG.prog(gl, SG.VS_QUAD, FS);

const LAND = [0.5, 1.0, 1.5];            // plants land on the beat
function plantX(t, k) {
