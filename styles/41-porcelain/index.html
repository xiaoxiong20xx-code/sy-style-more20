<script>
/* ===== 41 青花瓷 · BLUE-AND-WHITE PORCELAIN =====
   Real world: a thrown yuhuchun vase, still raw bisque (warm, matte, speckled, faint throwing rings), on a cast-iron
   banding wheel by a window. A wolf-hair brush loaded with raw cobalt paints the last lotus of a scroll: the pigment
   goes on wet and grey-black and soaks into the body. The painter then holds the brush still and spins the wheel —
   one perfect band line in half a second. On 4.0 the kiln takes it: a wall of fire light, the glaze vitrifies in a
   glowing front that climbs the vase in one beat, and behind it the grey turns to cobalt blue under a glassy glaze.
   The camera circles the finished vase under studio softboxes; on 8.0 the wheel stops and a strip light rakes the glaze.
   Lathe SDF from a smoothed profile table; pattern painted into an 8k unwrapped canvas (density + paint time). */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#060505');
Reel.ownJitter = true;
const C = Reel.cfg({});
const TAU = Math.PI * 2;

/* ---------------- the vase profile (yuhuchun) ---------------- */
const PROF = [[0, 0.150], [0.010, 0.157], [0.026, 0.161], [0.040, 0.170], [0.075, 0.209], [0.135, 0.250], [0.195, 0.269], [0.245, 0.272],
  [0.305, 0.261], [0.375, 0.228], [0.445, 0.182], [0.515, 0.137], [0.585, 0.102], [0.645, 0.081], [0.700, 0.0725], [0.750, 0.0715],
  [0.800, 0.0755], [0.860, 0.0885], [0.910, 0.106], [0.950, 0.124], [0.980, 0.136], [1.0, 0.141]];
const NP = 2048, RT = new Float32Array(NP), DRT = new Float32Array(NP);
(function buildProfile() {
  const n = PROF.length;
  const m = PROF.map((p, i) => {
    if (i === 0) return (PROF[1][1] - p[1]) / (PROF[1][0] - p[0]);
    if (i === n - 1) return (p[1] - PROF[n - 2][1]) / (p[0] - PROF[n - 2][0]);
    return 0.5 * ((PROF[i + 1][1] - p[1]) / (PROF[i + 1][0] - p[0]) + (p[1] - PROF[i - 1][1]) / (p[0] - PROF[i - 1][0]));
  });
  const raw = new Float32Array(NP);
  for (let k = 0; k < NP; k++) {
    const y = k / (NP - 1); let i = 0; while (i < n - 2 && y > PROF[i + 1][0]) i++;
    const [y0, r0] = PROF[i], [y1, r1] = PROF[i + 1], h = y1 - y0, u = (y - y0) / h, u2 = u * u, u3 = u2 * u;
    raw[k] = (2 * u3 - 3 * u2 + 1) * r0 + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * r1 + (u3 - u2) * h * m[i + 1];
  }
  const S = 6, K = [];
  for (let j = -18; j <= 18; j++) K.push(Math.exp(-j * j / (2 * S * S)));
  for (let k = 0; k < NP; k++) { let a = 0, w = 0; for (let j = -18; j <= 18; j++) { const kk = Math.min(NP - 1, Math.max(0, k + j)); a += raw[kk] * K[j + 18]; w += K[j + 18]; } RT[k] = a / w; }
  for (let k = 0; k < NP; k++) DRT[k] = (RT[Math.min(NP - 1, k + 1)] - RT[Math.max(0, k - 1)]) / ((Math.min(NP - 1, k + 1) - Math.max(0, k - 1)) / (NP - 1));
})();
const rOf = (y) => { const x = clamp(y) * (NP - 1), i = Math.min(NP - 2, Math.floor(x)), f = x - i; return RT[i] * (1 - f) + RT[i + 1] * f; };

/* ---------------- wheel rotation ---------------- */
// angular velocity: slow while painting, a hard spin for the band line (two turns a second), display speed, stop on 8.0
function omega(t) {
  if (t < 2.8) return 0.12;
  if (t < 3.0) return lerp(0.12, 12.566, E.inOutSine(inv(2.8, 3.0, t)));
  if (t < 3.5) return 12.566;
  if (t < 4.2) return lerp(12.566, 0.42, E.outCubic(inv(3.5, 4.2, t)));
  if (t < 7.2) return 0.42;
  if (t < 8.0) return lerp(0.42, 0, E.inOutSine(inv(7.2, 8.0, t)));

}
function phiOf(t) { const N = Math.max(1, Math.ceil(t * 400)), h = t / N; let a = 0; for (let i = 0; i < N; i++) a += omega((i + 0.5) * h) * h; return a; }

/* ---------------- the pattern: 8k unwrapped canvas (R density, G paint time) ---------------- */
const TW = 8192, TH = 4096, TMAX = 4.0;
const X = (th) => (th / TAU) * TW, Y = (y) => (1 - y) * TH;
const R = Reel.rng(41);
let patImg = null;
const TIME = new Uint8Array(TW * TH);          // paint time (0 = already painted)
const L = (thc, yc) => ([lx, ly]) => { const y = yc + ly; return [thc + lx / rOf(y), y]; };
// Catmull-Rom through control points -> dense list
function cr(pts, per = 10, closed = false) {

  const segs = closed ? n : n - 1;

    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * u2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * u3)));

// physical arc-length parametrisation of a (th, y) polyline
function arcPath(pts) {

  const x = X(th), yy = Y(y), rx = rw / (TAU * rOf(y)) * TW, ry = rw * TH;
  g.fillStyle = `rgb(${v},${v},${v})`;
  for (const off of [0, -TW, TW]) {
    if (off && !(x + off > -rx * 2 && x + off < TW + rx * 2)) continue;
    g.beginPath(); g.ellipse(x + off, yy, Math.max(0.6, rx), Math.max(0.6, ry), 0, 0, TAU); g.fill();
  }
}
function stampTime(th, y, rw, tq) {
  const x = X(((th % TAU) + TAU) % TAU), yy = Y(y), rx = rw / (TAU * rOf(y)) * TW + 1, ry = rw * TH + 1;
  for (let py = Math.floor(yy - ry); py <= Math.ceil(yy + ry); py++) {
    if (py < 0 || py >= TH) continue;
    for (let px = Math.floor(x - rx); px <= Math.ceil(x + rx); px++) {
      const dx = (px + 0.5 - x) / rx, dy = (py + 0.5 - yy) / ry;
      if (dx * dx + dy * dy > 1) continue;
      const o = py * TW + ((px % TW) + TW) % TW;

}
// one brush stroke: tapered, wobbling, slowly running dry; optional paint timing (t0..t1)
function stroke(g, pts, w0, den, timing) {
  const P = arcPath(pts), n = Math.max(4, Math.ceil(P.len / Math.max(0.00028, w0 * 0.22)));
  const sd = R() * 100;
  for (let i = 0; i <= n; i++) {
    const s = i / n, [th, y] = P.at(s);
    const w = w0 * brushW(s) * (1 + 0.12 * Reel.noise1(sd + s * 9));
    const v = Math.round(255 * den * (0.9 + 0.1 * Reel.noise1(sd * 2 + s * 5)) * (1 - 0.18 * s));
    stampG(g, th, y, w, v);
    if (timing) stampTime(th, y, w * 1.15, Math.max(1, Math.round((timing.t0 + (timing.t1 - timing.t0) * strokeEase(s)) / TMAX * 255)));
  }

}
const strokeEase = (s) => 0.75 * s + 0.25 * E.inOutSine(s);
// washes go on a quarter-size canvas (upscaled at the end = soft, slightly bled edges) — ctx.filter on 8k is far too slow
const WS = 4; let WG = null;
function fillPoly(g, pts, den, soft = 0) {
  const tgt = soft ? WG : g, k = soft ? 1 / WS : 1;
  tgt.fillStyle = `rgb(${Math.round(den * 255)},${Math.round(den * 255)},${Math.round(den * 255)})`;
  for (const off of [0, -TW, TW]) { tgt.beginPath(); pts.forEach(([th, y], i) => (i ? tgt.lineTo((X(th) + off) * k, Y(y) * k) : tgt.moveTo((X(th) + off) * k, Y(y) * k))); tgt.closePath(); tgt.fill(); }
  if (soft) {   // the pooled rim of a wash: a little darker just inside the edge
    tgt.save(); tgt.lineWidth = 1.6; tgt.strokeStyle = `rgb(${Math.round(Math.min(1, den * 1.35) * 255)},0,0)`;
    for (const off of [0, -TW, TW]) { tgt.beginPath(); pts.forEach(([th, y], i) => (i ? tgt.lineTo((X(th) + off) * k, Y(y) * k) : tgt.moveTo((X(th) + off) * k, Y(y) * k))); tgt.closePath(); tgt.stroke(); }
    tgt.restore();

}
function ring(g, y, w, den) {
  const pts = []; for (let k = 0; k <= 720; k++) { const th = k / 720 * TAU; pts.push([th, y + 0.0009 * Math.sin(th * 3 + y * 40) + 0.0005 * Math.sin(th * 11)]); }
  const P = arcPath(pts), n = Math.ceil(P.len / (w * 0.25));
  for (let i = 0; i <= n; i++) { const s = i / n, [th, yy] = P.at(s); stampG(g, th, yy, w * (0.85 + 0.25 * (0.5 + 0.5 * Math.sin(s * 23 + y * 9))), Math.round(255 * den * (0.82 + 0.18 * Math.sin(s * TAU * 3 + y * 50) ** 2))); }
}
const shrink = (pts, k) => { const c = pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]); return pts.map((p) => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k]); };

// a frontal lotus (番莲): pod, five petals, two sepals. local physical coords, pod top at (0,0)
const LOTUS = {
  pod: [[-0.013, -0.005], [-0.0125, 0.008], [-0.006, 0.0135], [0.006, 0.0135], [0.0125, 0.008], [0.013, -0.005], [0, -0.0085], [-0.013, -0.005]],
  pl: [[-0.013, -0.003], [-0.034, -0.006], [-0.054, 0.006], [-0.061, 0.027], [-0.051, 0.024], [-0.035, 0.013], [-0.016, 0.009]],
  pul: [[-0.011, 0.009], [-0.027, 0.02], [-0.035, 0.046], [-0.022, 0.037], [-0.009, 0.019]],
  ptop: [[-0.008, 0.0135], [-0.0145, 0.031], [0, 0.06], [0.0145, 0.031], [0.008, 0.0135]],
  pur: [[0.011, 0.009], [0.027, 0.02], [0.035, 0.046], [0.022, 0.037], [0.009, 0.019]],
  pr: [[0.013, -0.003], [0.034, -0.006], [0.054, 0.006], [0.061, 0.027], [0.051, 0.024], [0.035, 0.013], [0.016, 0.009]],
  sl: [[-0.006, -0.008], [-0.024, -0.013], [-0.042, -0.029], [-0.03, -0.026], [-0.004, -0.012]],
  sr: [[0.006, -0.008], [0.024, -0.013], [0.042, -0.029], [0.03, -0.026], [0.004, -0.012]],
};
const NLOT = 8, YV = 0.282, AV = 0.056, PHV = 0.4;
const vineY = (th) => YV + AV * Math.sin(4 * th + PHV);
const LOTUS_TH = (k) => (Math.PI / 2 - PHV) / 4 + k * Math.PI / 4;
const THL = Math.PI / 2 - 0.30;                 // world angle where the painter works
const TH0 = TAU - THL - LOTUS_TH(0);            // texture angle runs against world angle (pattern reads left-to-right from outside)
const ANIM = [];                                // the strokes painted on camera: {P, t0, t1, w}
const STROKES_T = [['pl', -0.12, 0.4], ['pul', 0.5, 0.86], ['ptop', 1.0, 1.38], ['pur', 1.5, 1.86], ['pr', 2.0, 2.36]];
const WASH_T = [2.45, 2.78];
const BAND = { y: 0.1555, t0: 3.0, t1: 3.5 };

function buildPattern() {
  const cv = Object.assign(document.createElement('canvas'), { width: TW, height: TH });
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, TW, TH);
  g.globalCompositeOperation = 'lighten';
  const wcv = Object.assign(document.createElement('canvas'), { width: TW / WS, height: TH / WS });
  WG = wcv.getContext('2d', { willReadFrequently: true }); WG.fillStyle = '#000'; WG.fillRect(0, 0, TW / WS, TH / WS); WG.globalCompositeOperation = 'lighten';
  // --- band lines (double, hand-banded) ---
  for (const [y, w, d] of [[0.040, 0.0016, 0.85], [0.047, 0.0011, 0.75], [0.164, 0.0013, 0.8], [0.405, 0.0016, 0.85], [0.413, 0.0011, 0.75],
    [0.525, 0.0014, 0.8], [0.532, 0.001, 0.7], [0.548, 0.0012, 0.75], [0.873, 0.0013, 0.8], [0.880, 0.001, 0.7], [0.965, 0.0012, 0.8], [0.988, 0.0011, 0.75]]) ring(g, y, w, d);
  // --- bottom: ten lotus-petal panels, each with a ruyi inside ---
  for (let k = 0; k < 10; k++) {
    const thc = TH0 + (k + 0.5) * TAU / 10, P = L(thc, 0);
    const hw = 0.5 * TAU * rOf(0.1) / 10 * 0.84;
    const outer = cr([[-hw, 0.052], [-hw * 1.02, 0.1], [-hw * 0.78, 0.13], [-hw * 0.3, 0.142], [0, 0.152], [hw * 0.3, 0.142], [hw * 0.78, 0.13], [hw * 1.02, 0.1], [hw, 0.052]], 8).map(P);
    const inner = cr([[-hw * 0.78, 0.056], [-hw * 0.8, 0.098], [-hw * 0.6, 0.122], [-hw * 0.22, 0.133], [0, 0.141], [hw * 0.22, 0.133], [hw * 0.6, 0.122], [hw * 0.8, 0.098], [hw * 0.78, 0.056]], 8).map(P);
    fillPoly(g, outer.concat(inner.slice().reverse()), 0.4, 3);

    const ru = cr([[-0.012, 0.085], [-0.016, 0.098], [-0.006, 0.106], [0, 0.098], [0.006, 0.106], [0.016, 0.098], [0.012, 0.085], [0, 0.072]], 6).map(P);

  for (let k = 0; k < NLOT; k++) {

    for (const key of ['pod', 'sl', 'sr']) { const pts = cr(LOTUS[key], 8).map(P); if (key !== 'pod') fillPoly(g, shrink(pts, 0.7), 0.42, 4); stroke(g, pts, 0.0016, 0.92); }

        const x0 = Math.min(...xs) - 6, x1 = Math.max(...xs) + 6, y0 = Math.min(...ys) - 6, y1 = Math.max(...ys) + 6;
        for (let py = Math.floor(y0); py <= y1; py++) for (let px = Math.floor(x0); px <= x1; px++) {

          TIME[o] = Math.round((WASH_T[0] + (WASH_T[1] - WASH_T[0]) * clamp(0.75 * v + 0.25 * u)) / TMAX * 255);
        }

    for (const sgn of [-1, 1, 0.5]) {
      const lth = th + sgn * 0.36 + 0.05, ly = vineY(lth), PL = L(TH0 + lth, ly);
      const ang = (sgn > 0 ? 0.6 : -0.6) + (vineY(lth + 0.01) > ly ? 0.4 : -0.4), up = (k + (sgn > 0 ? 1 : 0)) % 2 ? 1 : -1, sc = 1.15 + 0.25 * R();
      const leaf = [[0, 0], [0.008, 0.01], [0.006, 0.02], [0.013, 0.031], [0, 0.05], [-0.013, 0.031], [-0.006, 0.02], [-0.008, 0.01]]
        .map(([a, b]) => { const ca = Math.cos(ang), sa = Math.sin(ang); return [(a * ca - b * sa * up) * sc, (a * sa + b * ca * up) * sc]; });

      fillPoly(g, lp, 0.93, 0);
      g.save(); g.globalCompositeOperation = 'source-over'; g.strokeStyle = 'rgb(70,0,0)'; g.lineWidth = 3; g.beginPath();

      const tp = []; for (let i = 0; i <= 40; i++) { const a = i / 40 * 4.2, rr = 0.016 * (1 - i / 52); tp.push([-sgn * (0.012 + rr * Math.cos(a * sgn + 1)), -up * (0.004 + rr * Math.sin(a + 1))]); }

  for (let s = 0; s < 6; s++) stroke(g, sc.slice(s * 240, s * 240 + 244), 0.0016, 0.9);
  for (let k = 0; k < 12; k++) {
    const th = (Math.PI / 2 + k * TAU) / 12, up = 1, yb = 0.468 + 0.019;
    const curl = []; for (let i = 0; i <= 36; i++) { const a = i / 36 * 5.0, rr = 0.014 * (1 - i / 44); curl.push([0.004 + rr * Math.cos(a + 3.3), -0.017 + rr * Math.sin(a + 3.3) * 0.9]); }
    stroke(g, curl.map(L(TH0 + th, yb)), 0.0011, 0.85);
    const th2 = th + TAU / 24, yt = 0.468 - 0.019;
    const curl2 = curl.map(([a, b]) => [-a, -b]);
    stroke(g, curl2.map(L(TH0 + th2, yt)), 0.0011, 0.85);
    fillPoly(g, cr([[0, 0], [0.006, 0.006], [0, 0.016], [-0.006, 0.006]], 5, true).map(L(TH0 + th + 0.12, 0.494)), 0.85, 1);
  }
  // --- neck: eight banana leaves ---
  for (let k = 0; k < 8; k++) {
    const thc = TH0 + (k + 0.5) * TAU / 8;
    const hw = (y) => 0.5 * TAU * rOf(y) / 8 * 0.8 * Math.pow(clamp(1 - (y - 0.56) / 0.3), 0.8);
    const left = [], right = [];
    for (let i = 0; i <= 30; i++) { const y = 0.56 + 0.3 * i / 30; const w = hw(y) * (1 - 0.1 * Math.sin(i / 30 * Math.PI)); left.push([thc - w / rOf(y), y]); right.push([thc + w / rOf(y), y]); }
    const outline = left.concat(right.slice().reverse());

}

const rm = Reel.RM(stage, {

const vec3 LK = normalize(vec3(-.62, .55, .56));          // window / big softbox, camera-left
const vec3 LF = normalize(vec3(.8, .2, .55));             // fill, camera-right

const gl = rm.canvas.getContext('webgl2');
let texProf, texPat;

  for (let i = 0; i < NP; i++) { pd[i * 4] = RT[i]; pd[i * 4 + 1] = DRT[i]; }
  texProf = gl.createTexture(); gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, texProf);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, NP, 1, 0, gl.RGBA, gl.FLOAT, pd);

/* ---------------- the brush ---------------- */
const surf = (th, y, phi, lift = 0) => {
  const r = rOf(y), dr = drOf(y), a = phi - th;
  const n = [Math.cos(a), -dr, Math.sin(a)], l = Math.hypot(...n);
  const N = n.map((v) => v / l);
  return { S: [r * Math.cos(a) + N[0] * lift, y + N[1] * lift, r * Math.sin(a) + N[2] * lift], N };
};
const add = (a, b, k = 1) => a.map((v, i) => v + b[i] * k), nrm = (a) => { const l = Math.hypot(...a); return a.map((v) => v / l); };
function brush(t, phi) {
  const SEQ = ANIM, wc = ANIM.washC;
  const press = (s) => Math.pow(Math.sin(Math.PI * clamp(s * 0.92 + 0.05)), 0.35);
  let W = null, p = 0, dirW = [0, 1, 0];
  const onSurf = (th, y, ph, lift, pr, d) => {
    const { S, N } = surf(th, y, ph, lift + 0.0004 - pr * 0.0012);
    const a = ph - th, r = rOf(y);
    return { S, N, D: nrm([Math.sin(a) * d[0] * r + 1e-9, d[1], -Math.cos(a) * d[0] * r]) };
  };
  const travel = (ta, A, tb, B, hop) => {      // lifted move between two surface points, in world space
    const v = inv(ta, tb, t), w = E.inOutSine(v);
    const a = surf(A[0], A[1], phiOf(ta)), b = surf(B[0], B[1], phiOf(tb));
    const N = nrm(add(a.N.map((x) => x * (1 - w)), b.N, w));
    return { S: add(add(a.S.map((x) => x * (1 - w)), b.S, w), N, hop * Math.sin(Math.PI * v) + 0.0004), N, D: nrm(add(b.S, a.S, -1).map((x) => x + 1e-9)) };
  };

    const a = SEQ[k];

  }
  const last = SEQ[SEQ.length - 1];

  if (!W && t <= WASH_T[1]) { const s = inv(WASH_T[0], WASH_T[1], t), i = Math.min(wc.length - 2, Math.floor(s * (wc.length - 1))), f = s * (wc.length - 1) - i;
    p = 0.75 + 0.25 * Math.sin(s * 37); W = onSurf(lerp(wc[i][0], wc[i + 1][0], f), lerp(wc[i][1], wc[i + 1][1], f), phi, 0, p, [wc[i + 1][0] - wc[i][0], wc[i + 1][1] - wc[i][1]]); }
  if (!W && t < BAND.t0) { W = travel(WASH_T[1], wc[wc.length - 1], BAND.t0, [phiOf(BAND.t0) - THL, BAND.y], 0.018); p = 0.8 * E.inQuad(inv(2.93, 3.0, t)); }
  if (!W && t <= BAND.t1 + 0.05) { p = 0.8; W = onSurf(phi - THL, BAND.y, phi, 0, p, [1, 0]); }
  if (!W) W = onSurf(phi - THL, BAND.y, phi, 0.04 * E.outCubic(inv(BAND.t1 + 0.05, 3.7, t)) + 0.003, 0, [1, 0]);

  const H = nrm(add(N.map((v) => v * 0.55), [1.0, 0.8, -0.45], 1.0));
  // after the band line the painter draws the brush away along its own axis, clean out of frame
  const S = add(W.S, H, 1.8 * E.inCubic(inv(BAND.t1 + 0.08, 3.9, t)));

}
