<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>53 烙画 · Pyrography</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script><script src="../../lib/track.js"></script><script src="../../lib/pyro.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 53 烙画 · PYROGRAPHY =====
   A basswood board on a dark bench in low, raking afternoon light. An electric pyrography pen with a glowing wire
   nib draws a Huangshan pine on a rock: it touches down on the first beat, a thread of smoke curls up, the outline
   burns in, branches and fans of needles follow on the beats. The hook: the shading — cross-hatching on the rock,
   the shaded side of the trunk, the shadows under each needle pad — burns in one sweep and the picture jumps into
   three dimensions. On 8.0 the pen lifts off its last deep stroke and the last wisp of smoke drifts away.
   Renderer: strokes generated as real pen lines (lib/pyro.js), each texel's first-burn time and final darkness
   baked on the CPU; the shader burns them in as the nib passes (an ember glow for a moment, scorch -> brown ->
   char), the burnt lines sink a little into the wood and catch the raking light; the pen is an SDF (nichrome wire,
   brass posts, cork grip), smoke is a trail of puffs ray-marched with forward scattering; depth of field. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#070605');
Reel.ownJitter = true;
const DBG = Reel.Q.get('cam');
const DOM = [-11, -7.5, 22, 15], BW = 4096, BH = Math.round(4096 * 15 / 22);
const NS = 22;

const rm = Reel.RM(stage, {
  bloom: 0.34, th: 0.95, expo: 1.0, vig: 0.38, grain: 0.03, ca: 0.4, contrast: 1.05, sat: 1.0, bands: 6,
  lift: [0.004, 0.003, 0.002], gain: [1.0, 0.985, 0.96],
  uniforms: `
uniform sampler2D uBurn; uniform vec4 uDom;
uniform vec3 uRo, uTa; uniform float uTanF, uTm;
uniform vec4 uNib; uniform vec3 uPA;
uniform vec4 uSm[${NS}]; uniform vec4 uSmB[${NS}]; uniform vec4 uSmBound;`,
  scene: `
const vec3 LAMPP = vec3(-34., 13., -11.);                  // the desk lamp's bulb: low on the left, raking across the board
const vec3 LAMPA = vec3(.898, -.324, .299);                  // where its shade points
const vec3 LK = normalize(vec3(-.86, .30, -.30));
const vec3 LIGHT_COL = vec3(1.);   // colour of the desk lamp (lit surfaces, warm-wall bounce, metal glints, the bulb, smoke); vec3(1.) = original look
// ------------------------------------------------------------ the burn
vec4 burn4(vec2 uv){ vec2 tc = (uv - uDom.xy)/uDom.zw; if (tc.x < 0. || tc.y < 0. || tc.x > 1. || tc.y > 1.) return vec4(20., 0., 20., 0.); return texture(uBurn, tc); }
vec2 burnAt(vec2 uv){ vec4 b = burn4(uv); return uTm > b.x ? b.xy : b.zw; }
float darkAt(vec2 uv){ vec4 b = burn4(uv); return max(b.y*smoothstep(b.x, b.x + .08, uTm), b.w*smoothstep(b.z, b.z + .08, uTm)); }
// ------------------------------------------------------------ the pen
vec3 penLocal(vec3 p){
  vec3 A = uPA, B1 = normalize(cross(A, vec3(0., 1., 0.))), B2 = cross(A, B1);
  vec3 q = p - uNib.xyz; return vec3(dot(q, A), dot(q, B1), dot(q, B2));
}
float capA(vec3 q, vec3 a, vec3 b, float r){ return sdCapsule(q, a, b, r); }
float cylA(vec3 q, float a0, float a1, float r0, float r1){ float u = clamp((q.x - a0)/(a1 - a0), 0., 1.); float r = mix(r0, r1, u); vec2 d = vec2(length(q.yz) - r, max(a0 - q.x, q.x - a1)); return min(max(d.x, d.y), 0.) + length(max(d, 0.)); }
float gPen;
float sdPen(vec3 p){
  vec3 q = penLocal(p);
  if (q.x > 26. || length(q.yz) > 5.) { gPen = 0.; return max(length(q.yz) - 4.2, q.x - 25.); }
  float d = min(capA(q, vec3(0.), vec3(1.15, .17, 0.), .034), capA(q, vec3(0.), vec3(1.15, -.17, 0.), .034));   // the bent nichrome wire
  gPen = 1.;
  float t1 = min(cylA(q - vec3(0., .19, 0.), 1.1, 2.0, .065, .075), cylA(q - vec3(0., -.19, 0.), 1.1, 2.0, .065, .075));   // brass posts
  if (t1 < d) { d = t1; gPen = 2.; }
  float sh = cylA(q, 1.9, 3.4, .26, .40);                          // chrome heat shield
  sh = min(sh, cylA(q, 3.0, 3.4, .43, .43) - .012*step(.5, fract(atan(q.z, q.y)*9.55)));   // a knurled collar
  if (sh < d) { d = sh; gPen = 3.; }
  float gr = cylA(q, 3.4, 9.6, .50, .56) - .03*smoothstep(.4, 1., sin(q.x*6.2))*step(q.x, 5.6);   // cork grip, waisted for the fingers
  if (gr < d) { d = gr; gPen = 4.; }
  float rr = cylA(q, 9.6, 15.0, .53, .40);
  rr = min(rr, cylA(q, 15.0, 16.2, .22, .19));                      // strain relief
  if (rr < d) { d = rr; gPen = 5.; }
  // the power cord leaving the tail and falling away
  float cd = min(capA(q, vec3(16.1, 0., 0.), vec3(19.5, -.6, .4), .16), capA(q, vec3(19.5, -.6, .4), vec3(24., -3.5, 2.2), .16));
  if (cd < d) { d = cd; gPen = 5.; }
  return d;
}
vec3 penN(vec3 p){ vec2 k = vec2(1., -1.)*.003; return normalize(k.xyy*sdPen(p + k.xyy) + k.yyx*sdPen(p + k.yyx) + k.yxy*sdPen(p + k.yxy) + k.xxx*sdPen(p + k.xxx)); }
float penShadow(vec3 ro, vec3 rd){ float r = 1., t = .02; for (int i = 0; i < 48; i++){ float h = sdPen(ro + rd*t); if (gPen > 0.) r = min(r, 8.*h/t); t += clamp(h, .02, 1.5); if (r < .01 || t > 45.) break; } return clamp(r, 0., 1.); }
// ------------------------------------------------------------ wood
vec3 bass(vec3 p, out float rough){
  // basswood: pale, creamy, fine and even; the growth rings are faint and wander
  float w = p.z + .55*sin(p.x*.17 + 1.) + .35*fbm(vec3(p.x*.04, p.z*.25, 1.)) + .12*sin(p.x*.6 + p.z*.3);
  float ring = fract(w*.75 + .3*fbm(vec3(p.x*.1, p.z*.1, 4.)));
  float late = smoothstep(.70, .97, ring)*(1. - smoothstep(.985, 1., ring))*(.5 + .5*fbm(vec3(p.x*.2, p.z*.5, 9.)));
  vec3 c = mix(vec3(.88, .78, .62), vec3(.80, .66, .48), late*.45);
  c *= .97 + .04*vnoise(vec3(p.x*.5, p.z*45., 3.));
  c *= .95 + .07*fbm(vec3(p.xz*.25, 7.));
  c = mix(c, c*vec3(1., .93, .90), smoothstep(.4, .8, fbm(vec3(p.xz*.08, 11.)))*.5);
  rough = .65;
  return pow(c, vec3(2.2));
}
vec3 burnCol(vec3 wood, float d){
  vec3 c = mix(wood, pow(vec3(.80, .64, .43), vec3(2.2)), smoothstep(.0, .24, d));     // pale golden scorch
  c = mix(c, pow(vec3(.55, .37, .21), vec3(2.2)), smoothstep(.20, .46, d));            // tan
  c = mix(c, pow(vec3(.32, .19, .10), vec3(2.2)), smoothstep(.42, .70, d));            // warm brown
  c = mix(c, pow(vec3(.15, .085, .045), vec3(2.2)), smoothstep(.66, .88, d));          // dark brown
  c = mix(c, vec3(.010, .008, .007), smoothstep(.86, 1., d));                          // char
  return c;
}
float D_GGX(float nh, float a){ float a2 = a*a; float d = nh*nh*(a2 - 1.) + 1.; return a2/(PI*d*d); }
vec3 lampDir(vec3 p, out float att){
  vec3 Lv = LAMPP - p; float d = length(Lv); vec3 L = Lv/d;
  float spot = mix(.40, 1., smoothstep(.55, .92, dot(-L, LAMPA)));
  att = pow(38./max(d, 4.), 1.4)*spot;
  return L;
}
vec3 lightIt(vec3 p, vec3 n, vec3 v, vec3 alb, float rough, float metal, float sh){
  float att; vec3 L = lampDir(p, att);
  vec3 Lc = LIGHT_COL*vec3(1., .88, .72)*3.4*att;
  float ndl = max(dot(n, L), 0.), nv = max(dot(n, v), 1e-3);
  vec3 h = normalize(L + v); float a = max(rough*rough, .004);
  vec3 F0 = mix(vec3(.04), alb, metal);
  vec3 F = F0 + (1. - F0)*pow(1. - max(dot(h, v), 0.), 5.);
  vec3 col = (alb*(1. - metal)*ndl/PI*2.8 + D_GGX(max(dot(n, h), 0.), a)*F*.25/max(nv, .2)*ndl)*Lc*sh;
  // the room: warm walls, a little cool dusk from the window behind
  col += alb*(1. - metal)*LIGHT_COL*vec3(.12, .10, .08)*(.55 + .45*n.y);
  col += alb*(1. - metal)*vec3(.020, .028, .045)*max(dot(n, normalize(vec3(-.3, .4, -1.))), 0.);
  col += alb*(1. - metal)*LIGHT_COL*vec3(.04, .028, .018)*max(dot(n, normalize(vec3(.8, .4, .5))), 0.);
  // the nib's own glow
  float hot = uNib.w;
  vec3 dl = uNib.xyz - p; float dd = length(dl);
  col += alb*vec3(1., .32, .08)*hot*.55*max(dot(n, dl/dd), 0.)/(.06 + dd*dd*2.);
  vec3 rr = reflect(-v, n);
  col += F0*metal*(LIGHT_COL*mix(vec3(.04, .035, .03), vec3(.14, .12, .10), smoothstep(-.3, .7, rr.y)) + LIGHT_COL*vec3(1., .85, .6)*1.5*pow(max(dot(rr, L), 0.), 60.));
  return col;
}
// ------------------------------------------------------------ the craftsman's desk around the board
const float DY = -1.8;
float gE; float gEk;
float sdHex(vec2 p, float r){ p = abs(p); return max(p.x*.866 + p.y*.5, p.y) - r; }
mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float mapE(vec3 p){
  float d = p.y - DY; gE = 20.;                                      // the oak work desk
  float w = p.z + 48.; if (w < d) { d = w; gE = 21.; }                // the wall behind
  // a tool rail on the wall with carving tools hanging from it
  if (p.z < -44.) {
    float rail = sdBox(p - vec3(16., 9.5, -47.2), vec3(26., .9, .8)); if (rail < d) { d = rail; gE = 29.; }
    for (int i = 0; i < 7; i++){ float x = -4. + float(i)*5.6;
      float hd = sdCapsule(p, vec3(x, 8.4, -46.6), vec3(x, 3.8, -46.6), .65); if (hd < d) { d = hd; gE = 30.; }
      float bl = sdBox(p - vec3(x, 2.0, -46.6), vec3(.35 + .1*float(i % 3), 1.9, .08)); if (bl < d) { d = bl; gE = 31.; } }
  }
  // basswood blanks stacked at the back left
  if (length(p - vec3(-23., DY + 2., -16.)) < 16.) {
    for (int i = 0; i < 3; i++){ float fi = float(i); vec3 q = p - vec3(-23. + fi*.6, DY + .65 + fi*1.25, -16. + fi*.5); q.xz = rot2(.06*fi - .05)*q.xz;
      float b = sdRoundBox(q, vec3(9., .6, 6.), .06); if (b < d) { d = b; gE = 22.; } }
  }
  // two sheets of sandpaper, front right, one corner curling up
  if (length(p - vec3(19., DY, 11.)) < 12.) {
    vec3 q = p - vec3(20., DY + .03, 10.); q.xz = rot2(.35)*q.xz;
    float cu = max(q.x - 3.2, 0.); q.y -= cu*cu*.07;
    float s1 = sdBox(q, vec3(5.5, .025, 7.)); if (s1 < d) { d = s1; gE = 23.; }
    vec3 q2 = p - vec3(16.8, DY + .08, 13.); q2.xz = rot2(-.2)*q2.xz;
    float s2 = sdBox(q2, vec3(5.5, .025, 7.)); if (s2 < d) { d = s2; gE = 24.; }
  }
  // two pencils, front left
  for (int i = 0; i < 2; i++){
    float fi = float(i); vec3 a0 = vec3(-25. + fi*2.6, DY + .34, 11.5 - fi*1.4); vec3 dir = normalize(vec3(1., 0., -.22 - fi*.35));
    vec3 q = p - a0; float u = dot(q, dir); vec3 pp = q - dir*u;
    vec3 b2 = normalize(cross(dir, vec3(0., 1., 0.)));
    vec2 cs = vec2(pp.y, dot(pp, b2));
    float body = max(sdHex(cs, .31), max(-u, u - 15.));
    float tip = max(length(cs) - .31*clamp((17.2 - u)/2.2, 0., 1.), max(15. - u, u - 17.2));
    float era = max(length(cs) - .30, max(-u - 1.3, u));
    float pd = min(min(body, tip*.7), era);
    if (pd < d) { d = pd; gE = 25.; gEk = u; }
  }
  // the pen stand: a cast-iron foot and a conical coil the pen rests in
  if (length(p - vec3(18., DY + 3., -5.)) < 9.) {
    float ft = sdCylinder(p - vec3(18., DY + .55, -5.), .55, 3.1) - .1; if (ft < d) { d = ft; gE = 26.; }
    vec3 q = p - vec3(18., DY + 1.2, -5.);
    vec3 ax = normalize(vec3(-.55, .70, .45)), b1 = normalize(cross(ax, vec3(0., 0., 1.))), b2 = cross(ax, b1);
    vec3 cq = vec3(dot(q, ax), dot(q, b1), dot(q, b2));
    float rr = length(cq.yz), an = atan(cq.z, cq.y), P = .55, Rr = mix(.75, 1.25, clamp(cq.x/8., 0., 1.));
    float k = cq.x/P - an/6.2831853; float ph = (fract(k + .5) - .5)*P;
    float coil = max(length(vec2(rr - Rr, ph)) - .085, max(-cq.x, cq.x - 8.));
    coil = min(coil, sdCapsule(q, vec3(0.), ax*.6 + b1*.75, .1));
    if (coil*.8 < d) { d = coil*.8; gE = 27.; }
  }
  // a cup of tea on its saucer, back right
  if (length(p - vec3(24., DY + 3., -16.)) < 9.) {
    vec3 q = p - vec3(24., DY, -16.);
    float sc = max(length(q.xz) - 6.4, abs(q.y - .3) - .3); sc = max(sc, -max(length(q.xz) - 4.6, -(q.y - .45))); if (sc < d) { d = sc; gE = 32.; }
    float y = q.y - .6; float Rc = mix(3.4, 4.1, clamp(y/6.4, 0., 1.));
    float cup = max(abs(length(q.xz) - Rc) - .18, max(-y, y - 6.4));
    cup = min(cup, max(length(q.xz) - Rc, max(-y, .35 - y)));                   // its foot / bottom
    float hd = sdTorus((q - vec3(Rc + 1.1, 3.6, 0.)).xzy, vec2(1.35, .32)); hd = max(hd, -(length(q.xz) - Rc));
    cup = min(cup, hd);
    if (cup < d) { d = cup; gE = 32.; }
    float tea = max(length(q.xz) - (Rc - .2), abs(y - 5.2) - .02); if (tea < d) { d = tea; gE = 33.; }
  }
  // the burner's control box behind the board: a dial and a red pilot light
  if (length(p - vec3(3., DY + 3., -19.)) < 9.) {
    vec3 q = p - vec3(3., DY + 2.6, -19.);
    float bx = sdRoundBox(q, vec3(5.6, 2.6, 3.6), .35); if (bx < d) { d = bx; gE = 34.; }
    float dial = max(length(q.xy - vec2(2.2, .2)) - 1.25, abs(q.z - 3.95) - .5); dial -= .05*step(.6, fract(atan(q.y - .2, q.x - 2.2)*3.)); if (dial < d) { d = dial; gE = 35.; }
    float led = length(q - vec3(-2.6, 1.1, 3.62)) - .28; if (led < d) { d = led; gE = 36.; }
  }
  // a few shavings and curls left on the desk
  for (int i = 0; i < 7; i++){
    float fi = float(i); vec3 c = vec3(13.5*cos(fi*2.2 + .4) + 1.5*sin(fi*5.), DY + .45, 9.5*sin(fi*2.2 + .4) + 1.2*cos(fi*3.));
    if (abs(c.x) < 13.4 && abs(c.z) < 9.4) c.x += 13.4*sign(c.x + .001) - c.x*.0;
    vec3 q = p - c; q.xz = rot2(fi*1.3)*q.xz; q.yz = rot2(1.2 + fi*.4)*q.yz;
    float sv = max(sdTorus(q, vec2(.42 + .1*mod(fi, 3.), .05)), q.x - .2); if (sv < d) { d = sv; gE = 28.; }
  }
  // the desk lamp, far left: foot, arm and shade with its warm bulb
  if (length(p - vec3(-35., 6., -14.)) < 22.) {
    float lb = sdCylinder(p - vec3(-38., DY + .5, -18.), .5, 5.5) - .1; if (lb < d) { d = lb; gE = 37.; }
    float ar = min(sdCapsule(p, vec3(-38., DY + 1., -18.), vec3(-39., 17., -15.), .35), sdCapsule(p, vec3(-39., 17., -15.), vec3(-35.8, 14., -11.6), .3));
    if (ar < d) { d = ar; gE = 37.; }
    vec3 q = p - (LAMPP - LAMPA*1.8); float u = dot(q, LAMPA); float rr = length(q - LAMPA*u);
    float sh = max(abs(rr - mix(1.2, 4.2, clamp(u/5., 0., 1.))) - .12, max(-u, u - 5.)); if (sh < d) { d = sh; gE = 37.; }
    float bulb = length(p - LAMPP) - 1.1; if (bulb < d) { d = bulb; gE = 38.; }
  }
  return d;
}
vec3 nE(vec3 p){ vec2 k = vec2(1., -1.)*.01; return normalize(k.xyy*mapE(p + k.xyy) + k.yyx*mapE(p + k.yyx) + k.yxy*mapE(p + k.yxy) + k.xxx*mapE(p + k.xxx)); }
float shE(vec3 ro, vec3 rd, float tmax){ float r = 1., t = .08; for (int i = 0; i < 40; i++){ float h = mapE(ro + rd*t); r = min(r, 10.*h/t); t += clamp(h, .05, 4.); if (r < .01 || t > tmax) break; } return clamp(r, 0., 1.); }
// the board's own shadow on whatever lies under it toward the lamp
float boardShadow(vec3 p, vec3 L){
  vec3 bmin = vec3(-12.5, -1.8, -8.5), bmax = vec3(12.5, 0., 8.5);
  vec3 iv = 1./L, t0 = (bmin - p)*iv, t1 = (bmax - p)*iv; vec3 tmn = min(t0, t1), tmx = max(t0, t1);
  float tn = max(max(tmn.x, tmn.y), tmn.z), tf = min(min(tmx.x, tmx.y), tmx.z);
  return tf > max(tn, 0.) ? 1. - smoothstep(0., 1.2, tf - max(tn, 0.)) : 1.;
}
// ------------------------------------------------------------ smoke
float smokeD(vec3 p){
  float d = 0.;
  for (int i = 0; i < ${NS}; i++){ vec4 s = uSm[i]; float a = uSmB[i].x; if (a <= 0.) continue; vec3 q = p - s.xyz; q.y *= .42; d += a*exp(-dot(q, q)/(s.w*s.w)); }
  return d;
}
// ------------------------------------------------------------ render
vec3 render(vec2 fc){
  vec2 uvn = (2.*fc - uRes)/uRes.y;
  vec3 ww = normalize(uTa - uRo), uu = normalize(cross(ww, vec3(0., 1., 0.))), vv = cross(uu, ww);
  vec3 rd = normalize(ww + (uu*uvn.x + vv*uvn.y)*uTanF), ro = uRo;
  // pen
  float tp = 0.; bool hitP = false;
  for (int i = 0; i < 140; i++){ float h = sdPen(ro + rd*tp); if (h < .0015*(1. + tp*.05)) { hitP = true; break; } tp += h; if (tp > 120.) break; }
  // the board's top, its sides, and the desk world around it
  float tb = -ro.y/rd.y; vec3 pb = ro + rd*tb;
  bool onBoard = rd.y < 0. && tb > 0. && abs(pb.x) < 12.5 && abs(pb.z) < 8.5;
  vec3 bmin = vec3(-12.5, -1.8, -8.5), bmax = vec3(12.5, 0., 8.5);
  vec3 iv = 1./rd, b0 = (bmin - ro)*iv, b1 = (bmax - ro)*iv; vec3 tmn = min(b0, b1), tmx = max(b0, b1);
  float tn = max(max(tmn.x, tmn.y), tmn.z), tf = min(min(tmx.x, tmx.y), tmx.z);
  bool side = tn < tf && tn > 0. && (ro + rd*tn).y < -.001;
  float te = 0.; bool hitE = false;
  for (int i = 0; i < 170; i++){ float h = mapE(ro + rd*te); if (h < .002*(1. + te*.03)) { hitE = true; break; } te += h; if (te > 600.) break; }
  float best = 1e9; int kind = 0;
  if (hitP) { best = tp; kind = 1; }
  if (onBoard && tb < best) { best = tb; kind = 2; }
  if (side && tn < best) { best = tn; kind = 3; }
  if (hitE && te < best) { best = te; kind = 4; }
  vec3 col; float depth = best;
  vec3 v = -rd;
  if (kind == 1) {
    vec3 p = ro + rd*tp; vec3 n = penN(p);
    vec3 q = penLocal(p);
    sdPen(p); float id = gPen;
    float sh = 1.;
    if (id == 1.) {
      float glow = uNib.w*exp(-q.x/.42);
      col = lightIt(p, n, v, vec3(.55, .54, .52), .35, 1., sh)*(1. - glow) + vec3(1., .30, .06)*glow*7. + vec3(1., .7, .3)*pow(glow, 3.)*6.;
    } else if (id == 2.) col = lightIt(p, n, v, vec3(.95, .72, .40), .25, 1., sh);
    else if (id == 3.) col = lightIt(p, n, v, vec3(.82, .83, .85), .12, 1., sh) + vec3(.82, .83, .85)*.25*smoothstep(-.2, .8, reflect(-v, n).y);
    else if (id == 4.) { float ck = (.80 + .30*vnoise(p*22.))*(1. - .45*smoothstep(.72, .9, vnoise(p*60.)))*(1. - .3*smoothstep(.8, .95, vnoise(p*140. + 3.))); col = lightIt(p, n, v, pow(vec3(.70, .52, .33)*ck, vec3(2.2)), .85, 0., sh); }
    else col = lightIt(p, n, v, vec3(.02, .02, .022), .4, 0., sh);
  } else if (kind == 2) {
    vec3 p = pb;
    vec2 uv = vec2(p.x, -p.z);
    float rough; vec3 wood = bass(p, rough);
    float d0 = darkAt(uv);
    float e = .012;
    float dx = darkAt(uv + vec2(e, 0.)) - darkAt(uv - vec2(e, 0.)), dz = darkAt(uv + vec2(0., e)) - darkAt(uv - vec2(0., e));
    float dep = .016;
    float gx = .0025*(vnoise(vec3(p.x*.6 + .1, p.z*60., 3.)) - vnoise(vec3(p.x*.6 - .1, p.z*60., 3.)))/.2;
    vec3 n = normalize(vec3(dx*dep/(2.*e) - gx, 1., -dz*dep/(2.*e)));

/* ------------------------------------------------------------------ the drawing */
