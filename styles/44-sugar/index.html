<html lang="zh"><head><meta charset="utf-8"><title>44 糖画 · Sugar Painting</title>

<script>
/* ===== 44 糖画 · SUGAR PAINTING DRAGON =====
   A sugar-painting stall in a night market: a cold, polished white-marble slab on the stall's wooden table under one
   warm lamp; beside it a clay charcoal stove glowing through its mouth with the syrup pot on top, steam rising; a straw
   bundle stuck with finished sugar paintings; behind, out of focus, red lanterns, strings of bulbs, other stalls' lights
   and people passing. A small
   copper ladle trickles a thread of hot syrup and draws a dragon the way sugar-painting masters do: the head with open
   jaws, teeth, tongue, horns, mane, beard and whiskers; an S-coiled body whose outline is filled with one continuous run
   of little loops for scales; flame fins, four clawed legs, a flame tail, a pearl, two curling clouds — all joined.
   The sugar is a body, not a line: a height field (one round bead per pour, flat puddles where the hand paused) that is
   ray-marched as amber glass — Fresnel glaze with hard highlights, refraction of the marble under it, Beer-law colour
   from pale gold where thin to deep amber where thick, a few tiny bubbles.
   0.0 the thread is already falling, the jaws first · body, legs, fins, tail on the beats · 3.0–3.9 the loops of scales ·
   4.0 the stall's back light comes on and the camera drops low: light comes through the sugar, amber, and is focused
   onto the marble (hook) · pearl, whiskers, mane, clouds · 7.2 a bamboo stick is laid in and sealed with a dab of syrup ·
   7.45 the spatula slides under · 8.0 the painting is lifted and stood up on its stick, the back light through it · hold. */
const stage = Reel.makeStage('#0d0a08');
Reel.ownJitter = true;
const { clamp, lerp, E } = Reel;
const gl = CD.init(stage);
const W = CD.W, H = CD.H;
const POST = CD.post(gl);
const QUAD = SG.quad(gl);
const HD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const R = Reel.rng(4444), rr = (a, b) => a + (b - a) * R();
// sugar map: slab-space cm (y up), x ∈ [-18, 18], y ∈ [-12, 12]
const SX0 = -18, SY0 = -12, SWc = 36, SHc = 24, PXC = 50;
const MW = SWc * PXC, MH = SHc * PXC;
const HMAX = 0.5;

// ---------------- the pour ----------------
const ST = new SG.Strokes();
const SEGS = [];
let sid = 1;
function pour(pts, t0, t1, w, o = {}) {
  // puddles where the hand paused: at both ends and at every sharp turn of the path
  let Ls = [0]; for (let i = 1; i < pts.length; i++) Ls.push(Ls[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const Lt = Ls[Ls.length - 1] || 1, bumps = [];
  for (let i = 1; i < pts.length - 1; i++) {
    const ax = pts[i][0] - pts[i - 1][0], ay = pts[i][1] - pts[i - 1][1], bx = pts[i + 1][0] - pts[i][0], by = pts[i + 1][1] - pts[i][1];
    const c = (ax * bx + ay * by) / ((Math.hypot(ax, ay) * Math.hypot(bx, by)) || 1);
    if (c < 0.2 && !o.noPuddle) bumps.push(Ls[i] / Lt);
  }
  const sd = sid * 1.7;
  const wf = (u) => {
    let f = 1 + 0.5 * (Math.exp(-u * Lt / 0.35) + Math.exp(-(1 - u) * Lt / 0.35)) + 0.07 * Math.sin(u * Lt * 3.1 + sd);
    for (const b of bumps) f += 0.55 * Math.exp(-Math.pow((u - b) * Lt / 0.22, 2));
    return f;
  };
  if (!o.noTool) SEGS.push([t0, t1, SG.crSample(pts, 0.1)]);
  ST.add(pts, { w, t0, t1, kind: 0, seed: (sid++ * 3.7) % 91, ds: 0.035, pad: 0.35, lin: !!o.lin, wf });
}
const arc = (cx, cy, rx, ry, a0, a1, n = 24, rot = 0) => Array.from({ length: n + 1 }, (_, i) => {
  const a = lerp(a0, a1, i / n), x = Math.cos(a) * rx, y = Math.sin(a) * ry;
  return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)];
});
const spiral = (cx, cy, r0, r1, a0, turns, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, a = a0 + u * turns * 6.2832, r = lerp(r0, r1, u); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
// body
const SPINE = [[-8.0, 3.2], [-5.6, 5.8], [-2.0, 5.6], [0.8, 2.6], [3.0, -1.4], [6.2, -3.8], [9.6, -3.0], [11.8, -0.2], [12.4, 2.6]];
const spine = SG.crSample(SPINE, 0.08);
const spineAt = (u) => spine[Math.min(spine.length - 1, Math.max(0, Math.round(u * (spine.length - 1))))];
const spineT = (u) => { const a = spineAt(u - 0.01), b = spineAt(u + 0.01); const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
const spineN = (u) => { const t = spineT(u); return [-t[1], t[0]]; };
const thick = (u) => lerp(2.0, 0.45, Math.pow(u, 1.15)) * (0.86 + 0.22 * Math.sin(Math.PI * Math.min(1, u * 2)));
const edgeP = (side, u, k = 1) => { const p = spineAt(u), n = spineN(u), r = thick(u) * side * k; return [p[0] + n[0] * r, p[1] + n[1] * r]; };
const edge = (side, u0, u1, n, k = 1) => Array.from({ length: n + 1 }, (_, i) => edgeP(side, lerp(u0, u1, i / n), k));
let PIV = 0;
(function dragon() {
  let t = -0.08;
  const seg = (pts, dur, w, o) => { pour(pts, t, t + dur, w, o); t += dur; };
  // ---- head (facing left), the jaws open
  seg([[-8.9, 5.3], [-10.4, 5.1], [-12.1, 4.8], [-13.4, 5.0], [-13.6, 5.5], [-13.1, 5.8], [-12.8, 5.4]], 0.26, 0.4);            // upper jaw, curled nose
  seg([[-13.4, 4.6], [-12.4, 4.25], [-11.3, 3.95], [-10.2, 3.65]], 0.12, 0.36);                                                // upper lip
  seg([[-10.2, 3.65], [-11.8, 2.95], [-13.0, 2.25], [-12.6, 1.85], [-11.0, 2.15], [-9.1, 2.75]], 0.2, 0.38);                   // lower jaw
  const teethU = []; for (let k = 0; k <= 10; k++) { const x = lerp(-13.1, -11.0, k / 10), y = lerp(4.55, 3.92, k / 10); teethU.push([x, y - (k % 2 ? 0.42 : 0)]); }
  seg(teethU, 0.08, 0.2, { noPuddle: true });
  const teethL = []; for (let k = 0; k <= 8; k++) { const x = lerp(-12.6, -10.9, k / 8), y = lerp(2.3, 3.2, k / 8); teethL.push([x, y + (k % 2 ? 0.38 : 0)]); }
  seg(teethL, 0.07, 0.2, { noPuddle: true });
  seg([[-10.6, 3.35], [-11.8, 3.5], [-12.9, 3.15], [-14.0, 3.4], [-14.5, 3.75], [-14.0, 3.4], [-14.4, 2.95]], 0.12, 0.22);       // tongue, forked
  seg(arc(-10.9, 5.55, 0.55, 0.48, 0, 6.4, 16), 0.06, 0.3);                                                                    // eye
  seg([[-10.85, 5.55], [-10.8, 5.6]], 0.03, 0.75);                                                                              // pupil: a drop
  seg([[-11.8, 6.0], [-10.9, 6.55], [-9.8, 6.5], [-9.3, 6.0], [-9.6, 5.7]], 0.08, 0.3);                                         // brow curl
  // horns: two antlers sweeping back
  seg([[-9.6, 6.4], [-9.1, 7.8], [-8.0, 8.9], [-6.5, 9.4], [-7.4, 8.6], [-7.0, 10.3], [-7.8, 8.9], [-8.6, 8.6], [-8.6, 10.0]], 0.16, 0.32);
  seg([[-9.0, 6.0], [-8.2, 7.2], [-6.9, 8.0], [-5.5, 8.2], [-6.2, 7.6], [-5.6, 9.1]], 0.12, 0.3);
  // mane: flames behind the head
  for (let k = 0; k < 4; k++) {
    const b = [-8.6 + k * 0.55, 5.6 - k * 0.55], d = [0.9 + k * 0.1, 0.5 - k * 0.25];
    seg([b, [b[0] + d[0] * 0.8, b[1] + d[1] * 1.6 + 0.4], [b[0] + d[0] * 1.8, b[1] + d[1] * 1.2 + 0.2], [b[0] + d[0] * 1.5, b[1] + d[1] * 0.5], [b[0] + d[0] * 2.6, b[1] + d[1] * 1.5]], 0.07, 0.26);
  }
  // beard
  seg([[-11.0, 2.2], [-11.6, 1.3], [-11.0, 0.5], [-11.7, -0.3], [-11.2, -0.9]], 0.09, 0.24);
  seg([[-10.2, 2.45], [-10.4, 1.4], [-9.8, 0.7], [-10.3, -0.1]], 0.08, 0.24);
  // ---- body: back edge to the tail, round the tail, belly edge back to the throat (1.0–1.95)
  t = Math.max(t, 1.0);
  seg([[-8.9, 5.3]].concat(edge(1, 0.0, 1.0, 40)), 0.5, 0.42);
  seg([[12.5, 3.0], [12.9, 3.6], [12.4, 3.4]].concat(edge(-1, 1.0, 0.0, 40)).concat([[-9.1, 2.75]]), 0.45, 0.42);
  // ---- dorsal flame fins along the back (2.0–2.35)
  t = 2.0;
  const fins = [];
  for (let i = 0; i < 17; i++) {
    const u = 0.04 + i * 0.055, b0 = edgeP(1, u), b1 = edgeP(1, u + 0.03), n = spineN(u + 0.015), tg = spineT(u);
    const h = 1.0 * (1 - u * 0.55);
    fins.push(b0, [b0[0] + n[0] * h * 0.6 - tg[0] * 0.25, b0[1] + n[1] * h * 0.6 - tg[1] * 0.25], [b0[0] + n[0] * h + tg[0] * 0.35, b0[1] + n[1] * h + tg[1] * 0.35], b1);
  }
  seg(fins, 0.35, 0.26, { noPuddle: true });
  // ---- belly plates (2.35–2.5)
  for (let i = 0; i < 20; i++) { const u = 0.05 + i * 0.045; pour([edgeP(-1, u), edgeP(-1, u, 0.35)], t + i * 0.007, t + i * 0.007 + 0.012, 0.2, { noTool: i % 4 !== 0, noPuddle: true }); }
  t += 0.15;
  // ---- four legs with elbow tufts and curled claws (2.5–3.0)
  [[0.11, -1], [0.29, -1], [0.6, -1], [0.79, -1]].forEach(([u, side], k) => {
    const a = edgeP(side, u), n = spineN(u), tg = spineT(u);
    const elbow = [a[0] + n[0] * 1.8 * side + tg[0] * 0.6, a[1] + n[1] * 1.8 * side + tg[1] * 0.6];
    const foot = [elbow[0] - tg[0] * 1.1 + n[0] * 0.6 * side, elbow[1] - tg[1] * 1.1 + n[1] * 0.6 * side];
    const t0 = 2.5 + k * 0.125;
    pour([a, elbow, foot], t0, t0 + 0.05, 0.36);
    // three hooked claws
    for (let c = 0; c < 3; c++) {
      const ang = Math.atan2(n[1] * side, n[0] * side) + (c - 1) * 0.6;
      const tip = [foot[0] + Math.cos(ang) * 0.75, foot[1] + Math.sin(ang) * 0.75];
      pour([foot, tip, [tip[0] + Math.cos(ang + 1.6) * 0.3, tip[1] + Math.sin(ang + 1.6) * 0.3]], t0 + 0.05 + c * 0.015, t0 + 0.06 + c * 0.015, 0.26, { noTool: c > 0 });
    }
    // flame tuft at the elbow
    pour([elbow, [elbow[0] + tg[0] * 0.9 + 0.2, elbow[1] + tg[1] * 0.9 - 0.3], [elbow[0] + tg[0] * 0.5, elbow[1] + tg[1] * 0.5 - 0.6], [elbow[0] + tg[0] * 1.4, elbow[1] + tg[1] * 1.4 - 0.7]], t0 + 0.1, t0 + 0.12, 0.22, { noTool: true });
  });
  // ---- tail flame fan
  for (let k = 0; k < 5; k++) {
    const a = 0.3 + k * 0.42, b = [12.5, 3.0];
    pour([b, [b[0] + Math.cos(a) * 1.2, b[1] + Math.sin(a) * 1.4], [b[0] + Math.cos(a + 0.35) * 2.1, b[1] + Math.sin(a + 0.35) * 2.3], [b[0] + Math.cos(a - 0.1) * 2.8, b[1] + Math.sin(a - 0.1) * 3.0]], 2.98 - 0.12 + k * 0.024, 2.98 - 0.1 + k * 0.024, 0.26, { noTool: k > 0 });
  }
  // ---- the scales: one continuous run of little loops along the body (3.0–3.9)
  const loops = [];
  let ph = 0, prev = spineAt(0.03);
  for (let u = 0.03; u < 0.95; u += 0.0005) {
    const p = spineAt(u), n = spineN(u), tg = spineT(u), th = thick(u);
    const rL = 0.36 * th + 0.1;                         // loop radius follows the body's width
    const ds = Math.hypot(p[0] - prev[0], p[1] - prev[1]); prev = p;
    ph += 6.2832 * ds / (rL * 1.15);                    // one loop per ~1.15 radii of travel: the loops overlap like cursive e's
    loops.push([p[0] + n[0] * (0.08 * th + rL * Math.cos(ph)) - tg[0] * rL * Math.sin(ph), p[1] + n[1] * (0.08 * th + rL * Math.cos(ph)) - tg[1] * rL * Math.sin(ph)]);
  }
  pour(loops, 3.0, 3.9, 0.21, { noPuddle: true, lin: true });
  // ---- the pearl and its flames (4.5–5.1)
  pour(arc(-15.0, -4.6, 1.7, 1.7, 1.2, 1.2 + 6.35, 32), 4.5, 4.66, 0.36);
  pour(spiral(-15.0, -4.6, 1.3, 0.15, 1.2, 2.2, 50), 4.66, 4.88, 0.24, { noPuddle: true });
  for (let k = 0; k < 6; k++) {
    const a = k / 6 * 6.283 + 0.3, b = [-15.0 + Math.cos(a) * 1.7, -4.6 + Math.sin(a) * 1.7];
    pour([b, [b[0] + Math.cos(a + 0.4) * 0.6, b[1] + Math.sin(a + 0.4) * 0.6], [b[0] + Math.cos(a - 0.2) * 1.1, b[1] + Math.sin(a - 0.2) * 1.1]], 4.88 + k * 0.025, 4.9 + k * 0.025, 0.22, { noTool: k > 0 });
  }
  // ---- whiskers: long S-curves thrown fast (5.2–5.8), joining the pearl
  pour([[-12.9, 4.6], [-14.3, 5.8], [-13.6, 7.4], [-14.9, 8.7], [-14.1, 9.9]], 5.2, 5.45, 0.22);
  pour([[-12.5, 2.4], [-14.0, 1.2], [-13.4, -0.6], [-14.4, -2.2], [-15.0, -2.9]], 5.5, 5.75, 0.22);
  // ---- clouds: three joined spiral curls each (5.9–6.9)
  [[-3.6, -6.8, 1], [5.6, 7.4, -1]].forEach(([cx, cy, dir], k) => {
    const t0 = 5.9 + k * 0.5;
    pour(spiral(cx, cy, 1.1, 0.2, 3.4, 1.3 * dir, 28), t0, t0 + 0.12, 0.26, { noPuddle: true });
    pour(spiral(cx + 1.9, cy + 0.5, 0.9, 0.18, 3.4, 1.2 * dir, 24), t0 + 0.13, t0 + 0.24, 0.26, { noPuddle: true });
    pour(spiral(cx + 3.4, cy - 0.2, 0.75, 0.15, 3.4, 1.1 * dir, 20), t0 + 0.25, t0 + 0.34, 0.26, { noPuddle: true });
    pour([[cx - 1.1, cy - 0.4], [cx + 1.5, cy - 1.2], [cx + 3.6, cy - 1.0], [cx + 5.2, cy - 1.6]], t0 + 0.35, t0 + 0.42, 0.26);
  });
  // connectors so it all lifts as one piece: cloud ↔ claw, cloud ↔ fin
  { const a = [-3.2, -6.0], b = edgeP(-1, 0.43, 1.6); pour([a, [lerp(a[0], b[0], 0.3) - 0.9, lerp(a[1], b[1], 0.3)], [lerp(a[0], b[0], 0.55) + 0.8, lerp(a[1], b[1], 0.55)], [lerp(a[0], b[0], 0.8) - 0.5, lerp(a[1], b[1], 0.8)], b], 6.95, 7.0, 0.24, { noPuddle: true }); }
  { const a = [5.0, 6.6], b = edgeP(1, 0.22, 1.2); pour([a, [lerp(a[0], b[0], 0.35) + 0.7, lerp(a[1], b[1], 0.35)], [lerp(a[0], b[0], 0.7) - 0.6, lerp(a[1], b[1], 0.7)], b], 7.0, 7.05, 0.24, { noPuddle: true }); }
  PIV = -9.4;
})();
SEGS.sort((p, q) => p[0] - q[0]);
// the stick: laid in along the body at 7.2, sealed with a dab of syrup at 7.35
const STICK = { x: 1.0, y0: -15.5, y1: 3.4 };
ST.add([[0.8, -0.6], [1.2, 0.6], [0.8, 1.6]], { w: 0.95, t0: 7.35, t1: 7.42, kind: 0, seed: 9, ds: 0.035, pad: 0.35 });

// ---------------- GL ----------------
const pSugar = SG.prog(gl, SG.VS_STROKE, HD + `
in vec4 v0; flat in vec4 v1; flat in vec4 v2; flat in vec4 v3; flat in vec4 v4;
uniform float T; out vec4 o;
${SG.GLSL_NOISE}
void main(){
  float s = v0.z, v = v0.w, L = v1.x, w = v1.y, t0 = v1.z, t1 = v1.w, seed = v4.x;
  if (T < t0) discard;
  float head = L*clamp((T - t0)/max(t1 - t0, 1e-3), 0., 1.);
  float ds = s < 0. ? -s : (s > head ? s - head : 0.);
  float r = length(vec2(ds/(w*.5), v));
  if (r >= 1.) discard;
  // a round bead (wider puddles keep the same height, so they read flatter); hot sugar is a touch taller just behind the spout
  float age = T - (t0 + (t1 - t0)*clamp(s/max(L, 1e-3), 0., 1.));
  float hh = w*.47*pow(1. - r*r, .55)*(1. + .12*exp(-age*6.))*(1. + .04*(vn(vec2(s*9., seed)) - .5));
  o = vec4(hh/${HMAX.toFixed(2)}, 0., 0., 1.);
}`);
const tS = SG.tex(gl, MW, MH, {}), fS = SG.fbo(gl, [tS]);
ST.upload(gl);
const FS = HD + `
out vec4 o;
${CD.GLSL}
uniform sampler2D uS;
uniform float uT, uBack, uTop;
uniform mat4 uSug, uSugInv;            // sugar local ↔ world (rigid)
uniform vec3 uLad;                      // ladle spout
uniform vec3 uS0, uS1, uS2;            // the falling thread (quadratic)
uniform float uStream, uLadOn;
uniform vec4 uStick;                   // (visible, lifted)
uniform vec4 uSpat;                    // (x offset, visible, tilt, -) in the sugar's frame
const vec2 SMIN = vec2(${SX0.toFixed(1)}, ${SY0.toFixed(1)}), SSZ = vec2(${SWc.toFixed(1)}, ${SHc.toFixed(1)});
float hS(vec2 q){ vec2 uv = (q - SMIN)/SSZ; if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return 0.; return texture(uS, vec2(uv.x, 1. - uv.y)).r*${HMAX.toFixed(2)}; }
vec3 marbleAlb(vec2 p){
  vec2 q = p*.11;
  float w = fbm(q*1.3 + vec2(fbm(q*.7 + 3.), fbm(q*.9 + 9.))*1.6);
  float v = abs(sin((q.x*.8 + q.y*.35 + w*3.2)*3.1));
  float vein = smoothstep(.12, .0, v)*.5 + smoothstep(.04, .0, abs(sin((q.x*.3 - q.y*.9 + w*5.)*2.2)))*.28;
  vec3 base = vec3(.78, .78, .77)*(.95 + .06*fbm(p*.6));
  return mix(base, vec3(.34, .36, .39), clamp(vein, 0., .8));
}
const vec3 LT = normalize(vec3(-.3, .25, .92));             // the stall lamp, above
vec3 LB(){ return normalize(vec3(.05, .97, .2)); }          // the back light, low behind the slab
const vec3 LIGHT_COL = vec3(1.);   // stall lamp colour: everything scaled by uTop; vec3(1.) = original
const vec3 BACK_COL = vec3(1.);    // back light colour (the 4.0 hook): everything scaled by uBack; vec3(1.) = original
vec3 envCol(vec3 rd){
  vec3 c = mix(vec3(.005, .004, .004), vec3(.02, .013, .009), smoothstep(-.2, .5, rd.z));
  // the stall's own lamp: a small softbox above
  float dl = dot(rd, LT);
  c += vec3(1., .88, .7)*LIGHT_COL*uTop*(9.*smoothstep(.992, .998, dl) + .6*smoothstep(.9, .99, dl));
  if (rd.y > .05) {
    vec2 q = vec2(rd.x, rd.z)/rd.y;                  // directions as points on a screen one unit ahead (x right, up)
    c += vec3(.05, .025, .012)*smoothstep(.25, -.05, q.y);                     // warm haze over the market
    // other stalls' lights, low on the horizon: warm and cool panels
    for (int i = 0; i < 7; i++) {
      float fi = float(i);
      vec2 cc = vec2(-1.5 + fi*.48 + .1*sin(fi*2.3), -.025 + .02*fract(fi*.61));
      vec2 hs = vec2(.035 + .03*fract(fi*.37), .01 + .008*fract(fi*.53));
      vec2 dq = abs(q - cc) - hs;
      float m = 1. - smoothstep(-.005, .01, max(dq.x, dq.y));
      c += (mod(fi, 3.) == 1. ? vec3(.75, .85, 1.)*.9 : vec3(1., .66, .36)*1.4)*m;
    }
    // strings of bulbs sagging between poles
    for (int sI = 0; sI < 3; sI++) {
      float fs = float(sI), x0 = -1.5 + fs*.95, hgt = .115 + .02*fs;
      for (int k = 0; k < 14; k++) {
        float x = x0 + float(k)*.075, u = (x - x0)/1.0 - .5;
        vec2 b = vec2(x, hgt - .07*(1. - 4.*u*u));
        c += vec3(1., .72, .38)*9.*smoothstep(.0075, .0, length(q - b));
      }
    }
    // red paper lanterns
    for (int i = 0; i < 6; i++) {
      float fi = float(i);
      vec2 lc = vec2(-1.15 + fi*.47 + .06*sin(fi*1.7), .035 + .045*fract(fi*.618));
      vec2 d2 = (q - lc)/vec2(.03, .038);
      float r = length(d2);
