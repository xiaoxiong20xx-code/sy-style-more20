<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>45 金缮 · Kintsugi</title>
<script src="../../lib/core.js"></script><script src="../../lib/track.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 45 金缮 · KINTSUGI =====
   Real world: a Jian-ware tea bowl (束口盏) — black iron glaze with hare's-fur streaks, a rust-brown rim where the glaze
   runs thin, a fat glaze roll stopping short of the gritty dark foot — broken into six shards on indigo linen.
   On each beat a shard lifts and seats itself back into the bowl with a click. On 4.0 gold lacquer runs into the
   cracks: down from the rim, round the base, up every other crack, until the whole bowl is stitched in gold; a strip
   light rakes across on 5.0 and the gold flashes. The bowl turns to show its best face and stops on 8.0.
   Lathe SDF (outer/inner profile table) cut by analytic crack surfaces; each shard is the bowl ∩ its cell, moved by
   its own rigid transform; the gold is a ribbon around the crack/surface intersection. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#050506');
Reel.ownJitter = true;
const C = Reel.cfg({});
const TAU = Math.PI * 2;

/* ---------------- profile: outer and inner radius by height (1 unit = 10 cm) ---------------- */
const NP = 1024, YT = 0.69, YIB = 0.118;
const RO = new Float32Array(NP), RI = new Float32Array(NP);
function smoothArr(a, S) {
  const o = new Float32Array(a.length), K = [], W = Math.ceil(S * 3);
  for (let j = -W; j <= W; j++) K.push(Math.exp(-j * j / (2 * S * S)));
  for (let k = 0; k < a.length; k++) { let s = 0, w = 0; for (let j = -W; j <= W; j++) { const kk = Math.min(a.length - 1, Math.max(0, k + j)); s += a[kk] * K[j + W]; w += K[j + W]; } o[k] = s / w; }
  return o;
}
(function () {
  const ro = new Float32Array(NP), ri = new Float32Array(NP);
  for (let k = 0; k < NP; k++) {
    const y = k / (NP - 1) * YT;
    let r;
    if (y < 0.072) r = 0.205 - 0.008 * (1 - clamp(y / 0.018));                       // foot ring, bevelled
    else if (y < 0.088) r = lerp(0.205, 0.232, E.inOutSine(inv(0.072, 0.088, y)));     // the step up into the body
    else { const u = clamp((y - 0.08) / 0.53); r = 0.225 + 0.357 * (1 - Math.pow(1 - u, 1.75)); }
    if (y > 0.6) r += 0.0035 * (y - 0.6) / 0.09 - 0.0085 * Math.exp(-Math.pow((y - 0.632) / 0.011, 2)); // 束口 groove
    ro[k] = r;
    const w = 0.024 + 0.05 * Math.exp(-(y - 0.1) / 0.09) - 0.006 * clamp((y - 0.6) / 0.09);
    const bowlIn = Math.sqrt(Math.max(0, (y - YIB) * 2 * 0.6));                        // the well at the bottom
    ri[k] = y < YIB ? -0.05 : Math.min(r - w, bowlIn);
  }
  RO.set(smoothArr(ro, 3)); RI.set(smoothArr(ri, 4));
  for (let k = 0; k < NP; k++) if (k / (NP - 1) * YT < YIB) RI[k] = -0.05;
})();
const rOut = (y) => { const x = clamp(y / YT) * (NP - 1), i = Math.min(NP - 2, Math.floor(x)), f = x - i; return RO[i] * (1 - f) + RO[i + 1] * f; };
const rIn = (y) => { const x = clamp(y / YT) * (NP - 1), i = Math.min(NP - 2, Math.floor(x)), f = x - i; return RI[i] * (1 - f) + RI[i + 1] * f; };

/* ---------------- cracks (shared JS/GLSL) ---------------- */
const CK = [0.35, 1.62, 2.75, 3.95, 5.15];
const crackTh = (k, y) => CK[k] + 0.13 * Math.sin(y * 9 + k * 1.7) + 0.05 * Math.sin(y * 23 + k * 2.3) + 0.012 * Math.sin(y * 71 + k);
const ringY = (th) => 0.235 + 0.045 * Math.sin(2 * th + 1) + 0.025 * Math.sin(5 * th + 0.4) + 0.006 * Math.sin(17 * th);
const angIn = (a, lo, hi) => { const w = ((hi - lo) % TAU + TAU) % TAU; return (((a - lo) % TAU) + TAU) % TAU <= w; };
function pieceOf(th, y) {
  if (y < ringY(th)) return 5;
  for (let k = 0; k < 5; k++) if (angIn(th, crackTh(k, y), crackTh((k + 1) % 5, y))) return k;
  return 0;
}

/* ---------------- shard rest poses ---------------- */
const qmul = (a, b) => [a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1], a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0], a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3], a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
const qax = (ax, an) => { const l = Math.hypot(...ax), s = Math.sin(an / 2); return [ax[0] / l * s, ax[1] / l * s, ax[2] / l * s, Math.cos(an / 2)]; };
function qslerp(a, b, t) {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]; let bb = b; if (d < 0) { d = -d; bb = b.map((v) => -v); }
  if (d > 0.9995) { const r = a.map((v, i) => v + (bb[i] - v) * t), l = Math.hypot(...r); return r.map((v) => v / l); }
  const th = Math.acos(d), s = Math.sin(th); return a.map((v, i) => (Math.sin((1 - t) * th) * v + Math.sin(t * th) * bb[i]) / s);
}
const qmat = (q) => { const [x, y, z, w] = q; return [1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w), 2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w), 2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y)]; }; // column-major
const mv = (m, v) => [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]];
const PIECES = [];
(function () {
  const R = Reel.rng(45);
  for (let k = 0; k < 5; k++) {
    // sample the shard's surface
    const pts = []; let thc = 0, n = 0;
    for (let i = 0; i <= 24; i++) for (let j = 0; j <= 12; j++) {
      const y = lerp(0.2, YT, j / 12);
      const a0 = crackTh(k, y), a1 = crackTh((k + 1) % 5, y), w = ((a1 - a0) % TAU + TAU) % TAU, th = a0 + w * i / 24;
      if (y < ringY(th)) continue;
      pts.push([rOut(y) * Math.cos(th), y, rOut(y) * Math.sin(th)], [rIn(y) * Math.cos(th), y, rIn(y) * Math.sin(th)]);
      if (j === 6) { thc += th; n++; }
    }
    // the shard's own centre angle (unwrap around its start crack)
    const a0 = crackTh(k, 0.45), a1 = crackTh((k + 1) % 5, 0.45), mid = a0 + (((a1 - a0) % TAU + TAU) % TAU) / 2;
    // lie it on its back: outward normal -> down, then a random turn
    const no = [Math.cos(mid) * 0.82, -0.57, Math.sin(mid) * 0.82];
    const cr = [no[1] * 0 - no[2] * -1, no[2] * 0 - no[0] * 0, no[0] * -1 - no[1] * 0];  // cross(no, (0,-1,0))
    const ang = Math.acos(clamp(-no[1], -1, 1));
    let q = qax(cr, ang);
    q = qmul(qax([0, 1, 0], (R() - 0.5) * 2.2), q);
    const M = qmat(q);
    let minY = 1e9, cx = 0, cz = 0;
    for (const p of pts) { const w = mv(M, p); minY = Math.min(minY, w[1]); cx += w[0] / pts.length; cz += w[2] / pts.length; }
    const dist = 1.12 + 0.18 * R();
    const T = [Math.cos(mid) * dist - cx, -minY + 0.006, Math.sin(mid) * dist - cz];
    PIECES.push({ q, T, mid, tLand: 0.5 + k * 0.5 });
  }
})();

/* ---------------- renderer ---------------- */
const rm = Reel.RM(stage, {
  bloom: 0.55, th: 1.0, expo: 1.0, vig: 0.45, grain: 0.03, ca: 0.4, contrast: 1.06, sat: 1.0, bands: 4,
  lift: [0.004, 0.004, 0.006],
  uniforms: `
uniform sampler2D uProf;
uniform vec3 uRo, uTa; uniform float uF, uT;
uniform vec3 uR[18]; uniform vec3 uTr[6];
uniform float uSpin, uAsm;      // bowl turn; 1 once every shard is home
uniform vec4 uGold;             // flow clock (s since 4.0), on, sweep azimuth, sweep gain
uniform float uKey;`,
  scene: `
const float TAUf = 6.2831853, YT = ${YT.toFixed(4)}, YIB = ${YIB.toFixed(4)};
vec4 prof(float y){
  float x = clamp(y / YT, 0., 1.) * ${NP - 1}.; int i = min(int(floor(x)), ${NP - 2}); float f = x - float(i);
  return mix(texelFetch(uProf, ivec2(i, 0), 0), texelFetch(uProf, ivec2(i + 1, 0), 0), f);
}
float sdBowl(vec3 p){
  float rho = length(p.xz), y = p.y, yc = clamp(y, 0., YT);
  vec4 pr = prof(yc);
  float dout = (y >= 0. && y <= YT) ? (rho - pr.x) * inversesqrt(1. + pr.y * pr.y) : (rho < pr.x ? abs(y - yc) : length(vec2(rho - pr.x, y - yc)));
  float din = (rho - pr.z) * inversesqrt(1. + pr.w * pr.w);
  if (y < YIB) din = max(din, YIB - y);
  float d = smax(dout, -din, .006);
  // the fat roll where the glaze stopped short of the foot
  float th = atan(p.z, p.x);
  float yg = .158 + .012 * sin(th * 7. + 1.) + .03 * pow(max(sin(th * 3. + .6), 0.), 12.);
  d -= .0035 * exp(-pow((y - yg) / .009, 2.)) * smoothstep(.02, .0, abs(rho - pr.x));
  return d;
}
float crackTh(int k, float y){
  float c = k == 0 ? ${CK[0]} : k == 1 ? ${CK[1]} : k == 2 ? ${CK[2]} : k == 3 ? ${CK[3]} : ${CK[4]};
  float fk = float(k);
  return c + .13 * sin(y * 9. + fk * 1.7) + .05 * sin(y * 23. + fk * 2.3) + .012 * sin(y * 71. + fk);
}
float ringY(float th){ return .235 + .045 * sin(2. * th + 1.) + .025 * sin(5. * th + .4) + .006 * sin(17. * th); }
float wrapA(float a){ return mod(a + 3.14159265, TAUf) - 3.14159265; }
// signed distance (in the surface, ~physical) to shard k's cell: negative inside. k = 5: the foot piece
float cellD(vec3 p, int k){
  float th = atan(p.z, p.x), rho = max(length(p.xz), .05), y = p.y;
  float dr = (y - ringY(th)) * .9;
  if (k == 5) return dr;
  float a0 = crackTh(k, y), a1 = crackTh(k == 4 ? 0 : k + 1, y);
  float da = wrapA(th - a0) * rho, db = wrapA(a1 - th) * rho;
  return max(max(-da, -db), -dr);
}
// distance to the nearest crack line + which crack (0..4 wall, 5 ring) and where along it
float crackDist(vec3 p, out int ck){
  float th = atan(p.z, p.x), rho = max(length(p.xz), .05), y = p.y;
  float best = abs(y - ringY(th)) * .9; ck = 5;
  for (int k = 0; k < 5; k++){
    if (y < ringY(crackTh(k, y)) - .01) continue;
    float d = abs(wrapA(th - crackTh(k, y))) * rho; if (d < best) { best = d; ck = k; }
  }
  return best;
}
// when the gold reaches this point of the network (s since 4.0)
float goldArrive(vec3 p, int ck){
  float th = atan(p.z, p.x), y = p.y;
  const float V = 1.5, VR = 2.6, RR = .4;
  float tRing0 = (YT - ringY(crackTh(0, ringY(crackTh(0, .25))))) / V;
  float a0 = crackTh(0, ringY(crackTh(0, .25)));
  if (ck == 0) return (YT - y) / V;
  if (ck == 5) return tRing0 + abs(wrapA(th - a0)) * RR / VR;
  float ak = crackTh(ck, .25);
  return tRing0 + abs(wrapA(ak - a0)) * RR / VR + max(y - ringY(ak), 0.) / V;
}
vec3 bowlLocal(vec3 p){ return rotY(uSpin) * p; }
mat3 RK(int k){ return mat3(uR[k * 3], uR[k * 3 + 1], uR[k * 3 + 2]); }
int gM = 0; int gK = 0; float gFrac = 0.;
float mapShards(vec3 p, out int kk, out float frac){
  float d = 1e3; kk = 0; frac = 0.;
  for (int k = 0; k < 6; k++){
    vec3 q = RK(k) * (p - uTr[k]);
    q = bowlLocal(q);
    float bb = length(q - vec3(0., .35, 0.)) - .66;
    if (bb > d) continue;
    float db = sdBowl(q), dc = cellD(q, k);
    float s = max(db, dc + .0006 * (1. - uAsm));
    if (s < d) { d = s; kk = k; frac = dc > db - .0004 ? 1. : 0.; }
  }
  return d;
}
float goldSD(vec3 p, out float fresh){
  fresh = 0.;
  if (uGold.y < .5) return 1e3;
  vec3 q = bowlLocal(p);
  if (length(q - vec3(0., .35, 0.)) > .72) return length(q - vec3(0., .35, 0.)) - .7;
  int ck; float dc = crackDist(q, ck);
  float db = sdBowl(q);
  float ta = goldArrive(q, ck);
  float age = uGold.x - ta;
  float on = smoothstep(-.02, .03, age);
  fresh = exp(-max(age, 0.) / .35) * on;
  float w = mix(.0, .0055, on) * (1. + .5 * fresh), h = mix(-.002, .0012, on) * (1. + 1.2 * fresh);
  vec2 e = vec2(dc - w, abs(db) - h);
  return min(max(e.x, e.y), 0.) + length(max(e, 0.)) - .0009;
}
// indigo linen, flat near the bowl, soft folds further out
// the runner: undyed linen laid on a dark elm tea table; small soft wrinkles toward its edges
float clothH(vec2 xz){ return .006 + .004 * smoothstep(.9, 1.4, abs(xz.y)) * (fbm2(xz * 2.2) - .4) + .0012 * (vnoise2(xz * 9.) - .5); }
float clothSD(vec3 p){ return max(p.y - clothH(p.xz), max(abs(p.z) - 1.45, abs(p.x) - 2.62)); }
float tableSD(vec3 p){ return sdRoundBox(p - vec3(0., -.07, 0.), vec3(2.6, .07, 1.8), .025); }
// a lacquer box of gold powder, a makie brush on its rest, a bamboo tea scoop, a lacquer tea caddy
const vec3 PB = vec3(-1.85, 0., -1.15), PR = vec3(1.75, 0., -1.35), PS = vec3(-.15, 0., 1.7), PC = vec3(2.05, 0., .35);
float propSD(vec3 p, out int k){
  float d = sdRoundBox(p - PB - vec3(0., .1, 0.), vec3(.2, .1, .15), .015); k = 0;
  d = max(d, -sdBox(p - PB - vec3(0., .2, 0.), vec3(.17, .07, .12)));                         // open: hollow
  float gp = sdBox(p - PB - vec3(0., .14, 0.), vec3(.17, .012, .12)); if (gp < d) { d = gp; k = 1; }   // the gold powder in it
  float rs = sdRoundBox(p - PR - vec3(0., .03, 0.), vec3(.05, .03, .04), .02); if (rs < d) { d = rs; k = 2; }
  float br = sdCapsule(p, PR + vec3(-.75, .02, .35), PR + vec3(.05, .075, 0.), .018); if (br < d) { d = br; k = 3; }
  vec3 q = p - PS; q.xz = mat2(.8, .6, -.6, .8) * q.xz;
  float sc = sdRoundBox(q - vec3(0., .012 + .015 * smoothstep(.6, .9, q.x), 0.), vec3(.9, .006, .045), .005); if (sc < d) { d = sc; k = 4; }
  float cd = sdRoundCylinder(p - PC - vec3(0., .17, 0.), .085, .045, .13); if (cd < d) { d = cd; k = 5; }
  return d;
}
float propD(vec3 p){ int k; return propSD(p, k); }
float map(vec3 p){
  int kk; float fr;
  float d = mapShards(p, kk, fr); gM = 1; gK = kk; gFrac = fr;
  float fresh; float g = goldSD(p, fresh); if (g < d) { d = g; gM = 2; }
  float c = clothSD(p); if (c < d) { d = c * .9; gM = 3; }
  float tb = tableSD(p); if (tb < d) { d = tb; gM = 4; }
  int pk; float pr = propSD(p, pk); if (pr < d) { d = pr; gM = 5 + pk; }
  return d;
}
float mapS(vec3 p){ int kk; float fr, fresh; return min(min(min(mapShards(p, kk, fr), goldSD(p, fresh)), min(clothSD(p), tableSD(p))), propD(p)); }
vec3 calcN(vec3 p){ vec2 e = vec2(.0003, 0.); return normalize(vec3(mapS(p + e.xyy) - mapS(p - e.xyy), mapS(p + e.yxy) - mapS(p - e.yxy), mapS(p + e.yyx) - mapS(p - e.yyx))); }
float gJit = 0.;
float softSh(vec3 p, vec3 L, float k){
  float res = 1., t = .002 + .006 * gJit;
  for (int i = 0; i < 72; i++){ float h = mapS(p + L * t); res = min(res, k * h / t); if (res < .002 || t > 3.) break; t += clamp(h, .002, .12) * (.85 + .3 * gJit); }
  res = clamp(res, 0., 1.); return res * res * (3. - 2. * res);
}
float aoF(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i = 1; i <= 5; i++){ float h = .015 * float(i) * float(i); o += (h - mapS(p + n * h)) * s; s *= .6; } return clamp(1. - o * 2., 0., 1.); }
const vec3 LK = normalize(vec3(-.55, .75, -.38));     // big soft window, behind-left, high
const vec3 LIGHT_COL = vec3(1.);   // key window colour (all key-lit surfaces, the window in reflections, the shoji wall); vec3(1.) = original
const vec3 LF = normalize(vec3(.7, .35, .62));        // low warm card, front-right
float rectL(vec3 d, vec3 c, vec2 sz, float soft){
  float z = dot(d, c); if (z <= 0.) return 0.;
  vec3 r = normalize(cross(vec3(0., 1., 0.), c)), u = cross(c, r);
  vec2 q = vec2(dot(d, r), dot(d, u)) / z; vec2 e = abs(q) - sz;
  return (1. - smoothstep(-soft, soft, e.x)) * (1. - smoothstep(-soft, soft, e.y)) * (.8 + .2 * (1. - length(q / sz) * .7));
}
vec3 env(vec3 d){
  vec3 c = vec3(.008, .009, .012) * (.5 + .5 * d.y);
  { float z = dot(d, LK); if (z > 0.) { vec3 r = normalize(cross(vec3(0., 1., 0.), LK)), u = cross(LK, r); vec2 q = vec2(dot(d, r), dot(d, u)) / z;
      vec2 e = abs(q) - vec2(.6, .42);
      float paper = (1. - smoothstep(-.04, .04, e.x)) * (1. - smoothstep(-.04, .04, e.y));
      vec2 g = abs(fract(q / vec2(.15, .1) + .5) - .5) * vec2(.15, .1);
      float lat = smoothstep(.006, .003, min(g.x, g.y));                                    // kumiko lattice
      c += LIGHT_COL * vec3(1., .95, .86) * paper * (1. - .75 * lat) * (.9 + .1 * vnoise2(q * 30.)) * 4.2 * uKey; } }
  c += vec3(1., .86, .7) * rectL(d, LF, vec2(.35, .22), .1) * .9;
  c += vec3(.16, .12, .08) * smoothstep(-.1, .4, d.y) * smoothstep(.9, .3, d.y) * .5;      // the room: earth walls, wood, tatami
  vec3 sd = normalize(vec3(sin(uGold.z), .28, cos(uGold.z)));
  c += vec3(1., .96, .9) * rectL(d, sd, vec2(.03, .7), .015) * 16. * uGold.w;
  c += vec3(.02, .025, .05) * smoothstep(.0, -.5, d.y);
  return c;
}
vec3 room(vec3 ro, vec3 rd, out float tw){
  tw = 30.; vec3 c = vec3(.03, .025, .02);
  float t1 = rd.z < 0. ? (-8.5 - ro.z) / rd.z : 1e9;          // shoji wall
  float t2 = rd.y < 0. ? (-3. - ro.y) / rd.y : 1e9;           // tatami
  float t3 = rd.x < 0. ? (-8. - ro.x) / rd.x : rd.x > 0. ? (8. - ro.x) / rd.x : 1e9;   // earthen walls
  float t = min(t1, min(t2, t3)); if (t > 1e8) return c;
  vec3 P = ro + rd * t; tw = t;
  if (t == t1) {
    vec2 q = P.xy;
    vec2 g = abs(fract(q / vec2(.9, .6) + .5) - .5) * vec2(.9, .6);
    float lat = smoothstep(.035, .02, min(g.x, g.y));
    float post = smoothstep(.12, .08, abs(fract(q.x / 5.4 + .5) - .5) * 5.4);
    c = LIGHT_COL * vec3(1., .93, .82) * .78 * (1. - .7 * lat) * smoothstep(-3., -2.4, q.y) * smoothstep(9., 7.5, q.y);
    c = mix(c, vec3(.08, .055, .035), post);
  } else if (t == t2) {
    vec2 q = P.xz; float st = .5 + .5 * sin(q.y * 60.) * .3 + .2 * vnoise2(vec2(q.x * 2., q.y * 40.));
    float border = smoothstep(.09, .06, abs(fract(q.y / 3.6 + .5) - .5) * 3.6);
    c = mix(vec3(.3, .27, .17) * (.8 + .25 * st), vec3(.06, .05, .04), border) * (.35 + .5 * exp(-max(-q.y - 4., 0.) * .2));
  } else {
    c = vec3(.3, .22, .15) * (.65 + .35 * fbm2(P.zy * 1.2)) * .45;
  }
  return c;
}
vec3 glaze(vec3 q, vec3 nl, bool inside, out float rough){
  // hare's fur: fine streaks running down from the rim, rust at the thin rim, a black pool in the well
  float th = atan(q.z, q.x), y = q.y;
  // 兔毫: fine brown filaments that ran down from the rim as the glaze melted, tapering to points;
  // two interleaved layers so they are dense but never regular; glossy black glaze between them
  vec3 c = vec3(.006, .0065, .009);
  float fur = 0., gold = 0.;
  for (int L = 0; L < 2; L++) {
    float fl = float(L);
    float u = th * (L == 0 ? 150. : 233.) + .9 * sin(y * 7. + th * 3. + fl * 2.) + fl * .37;
    float cell = floor(u), fu = fract(u) - .5;
    float h = hash11(cell + 17. + fl * 41.), h2 = hash11(cell * 3.7 + 5. + fl * 13.);

vec3 shade(vec3 ro, vec3 rd, float tt, vec3 P){

  return c;
}

const gl = rm.canvas.getContext('webgl2');
let texProf;
function uploads() {

  for (let i = 0; i < NP; i++) {
    const a = Math.max(0, i - 1), b = Math.min(NP - 1, i + 1);

// each shard: rests on the cloth, lifts, arcs in and seats on its beat (0.5, 1.0 ... 2.5)
